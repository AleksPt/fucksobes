<text class="s" x="240" y="44" text-anchor="middle" dominant-baseline="central">действия</text>
<path d="M352 84 H128" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="240" y="72" text-anchor="middle" dominant-baseline="central">binding: уведомляет об изменениях</text>
