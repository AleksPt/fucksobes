<svg xmlns="http://www.w3.org/2000/svg" width="720" height="136" viewBox="0 0 720 136" role="img">
<title>MVVM: View, ViewModel и Model</title>
<desc>View передаёт действия в ViewModel. ViewModel через биндинг уведомляет View об изменениях и обращается к Model. ViewModel не знает о View.</desc>
