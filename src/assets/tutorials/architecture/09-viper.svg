<text class="s" x="194" y="52" text-anchor="middle" dominant-baseline="central">события / показ</text>
<path d="M388 56 H516" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="452" y="44" text-anchor="middle" dominant-baseline="central">запрос</text>
<path d="M516 84 H388" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
