<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img">
<title>VIPER: связи между компонентами модуля</title>
<desc>View и Presenter обмениваются событиями и показом. Presenter отправляет запрос Interactor и получает результат. Presenter передаёт переход Router. Interactor работает с Entity.</desc>
