<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img">
<title>DIP, IoC и DI: как связаны термины</title>
<desc>DIP это принцип: зависим от абстракций. Из него следует идея IoC: объект не создаёт зависимости сам, а получает их. IoC реализуют DI, Service Locator и Factory Method.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
.s,.b{font-weight:500}</style></defs>
<rect width="720" height="284" rx="16" fill="#14151c"/>
<rect x="230" y="24" width="260" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="40.0" text-anchor="middle" dominant-baseline="central">DIP — принцип:</text>
<text class="s" x="360.0" y="61.0" text-anchor="middle" dominant-baseline="central">зависим от абстракций</text>
<rect x="230" y="116" width="260" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="132.0" text-anchor="middle" dominant-baseline="central">IoC — идея:</text>
<text class="s" x="360.0" y="153.0" text-anchor="middle" dominant-baseline="central">не сам создаёт, а получает</text>
<path d="M360 76 V112" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="24" y="208" width="232" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="140.0" y="224.0" text-anchor="middle" dominant-baseline="central">DI — приём:</text>
<text class="s" x="140.0" y="245.0" text-anchor="middle" dominant-baseline="central">зависимости передают снаружи</text>
<rect x="280" y="208" width="160" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="234.0" text-anchor="middle" dominant-baseline="central">Service Locator</text>
<rect x="536" y="208" width="160" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="616.0" y="234.0" text-anchor="middle" dominant-baseline="central">Factory Method</text>
<path d="M360 168 V188 H140 V204" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M360 168 V204" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M360 168 V188 H616 V204" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>
