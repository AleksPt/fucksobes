<svg xmlns="http://www.w3.org/2000/svg" width="720" height="148" viewBox="0 0 720 148" role="img">
<title>TDD: цикл Red, Green, Refactor</title>
<desc>Сначала пишем падающий тест (Red), затем минимальный код, чтобы тест прошёл (Green), затем улучшаем код при зелёных тестах (Refactor) и возвращаемся к новому тесту.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
.s,.b{font-weight:500}</style></defs>
<rect width="720" height="148" rx="16" fill="#14151c"/>
<rect x="24" y="24" width="192" height="64" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="120" y="44" text-anchor="middle" dominant-baseline="central">Red:</text>
<text class="s" x="120" y="63" text-anchor="middle" dominant-baseline="central">пишем падающий</text>
<text class="s" x="120" y="79" text-anchor="middle" dominant-baseline="central">тест</text>
<rect x="264" y="24" width="192" height="64" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360" y="44" text-anchor="middle" dominant-baseline="central">Green:</text>
<text class="s" x="360" y="63" text-anchor="middle" dominant-baseline="central">минимальный код,</text>
<text class="s" x="360" y="79" text-anchor="middle" dominant-baseline="central">чтобы прошёл</text>
<path d="M216 56 H260" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="504" y="24" width="192" height="64" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="600" y="44" text-anchor="middle" dominant-baseline="central">Refactor:</text>
<text class="s" x="600" y="63" text-anchor="middle" dominant-baseline="central">улучшаем,</text>
<text class="s" x="600" y="79" text-anchor="middle" dominant-baseline="central">тесты зелёные</text>
<path d="M456 56 H500" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M600 88 V120 H120 V92" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>
