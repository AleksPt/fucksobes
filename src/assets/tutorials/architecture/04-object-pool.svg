<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img">
<title>Object Pool: взять и вернуть объект</title>
<desc>Клиент вызывает acquire у пула, получает объект или ждёт, если пул пуст, использует его и возвращает вызовом release.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
.s,.b{font-weight:500}</style></defs>
<rect width="720" height="280" rx="16" fill="#14151c"/>
<rect x="90.0" y="24" width="120" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="150" y="42.0" text-anchor="middle" dominant-baseline="central">Клиент</text>
<line x1="150" y1="60" x2="150" y2="256" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="510.0" y="24" width="120" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="570" y="42.0" text-anchor="middle" dominant-baseline="central">Pool</text>
<line x1="570" y1="60" x2="570" y2="256" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M150 104 L566 104" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="360.0" y="92" text-anchor="middle" dominant-baseline="central">acquire()</text>
<path d="M570 152 L154 152" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="360.0" y="140" text-anchor="middle" dominant-baseline="central">объект (или ждёт, если пул пуст)</text>
<path d="M150 184 H186 V208 H154" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="196" y="196.0" text-anchor="start" dominant-baseline="central">использует</text>
<path d="M150 240 L566 240" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="360.0" y="228" text-anchor="middle" dominant-baseline="central">release(объект)</text>
</svg>
