<svg xmlns="http://www.w3.org/2000/svg" width="720" height="718" viewBox="0 0 720 718" role="img">
<title>Одна итерация RunLoop</title>
<desc>Цепочка состояний: Entry, BeforeTimers, BeforeSources, ProcessSources, BeforeWaiting, Sleeping, AfterWaiting, HandleWakeUp; между состояниями observers получают уведомления entry, beforeTimers, beforeSources, beforeWaiting, afterWaiting. После обработки того, что разбудило, цикл возвращается к BeforeTimers либо при stop, отсутствии источников или тайм-ауте идёт в Exit и завершается с уведомлением exit.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="718" rx="16" fill="#14151c"/>
<rect x="130" y="62" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="215.0" y="80.0" text-anchor="middle" dominant-baseline="central">Entry</text>
<rect x="130" y="132" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="215.0" y="150.0" text-anchor="middle" dominant-baseline="central">BeforeTimers</text>
<rect x="130" y="202" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="215.0" y="220.0" text-anchor="middle" dominant-baseline="central">BeforeSources</text>
<rect x="130" y="272" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="215.0" y="290.0" text-anchor="middle" dominant-baseline="central">ProcessSources</text>
<rect x="130" y="342" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="215.0" y="360.0" text-anchor="middle" dominant-baseline="central">BeforeWaiting</text>
<rect x="130" y="412" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="215.0" y="430.0" text-anchor="middle" dominant-baseline="central">Sleeping</text>
<rect x="130" y="482" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="215.0" y="500.0" text-anchor="middle" dominant-baseline="central">AfterWaiting</text>
<rect x="130" y="552" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="215.0" y="570.0" text-anchor="middle" dominant-baseline="central">HandleWakeUp</text>
<rect x="130" y="622" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="215.0" y="640.0" text-anchor="middle" dominant-baseline="central">Exit</text>
<circle cx="215.0" cy="26" r="6" fill="#a4a6b0"/>
<path d="M215.0 32 V62" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="229.0" y="45" text-anchor="start" dominant-baseline="central">run()</text>
