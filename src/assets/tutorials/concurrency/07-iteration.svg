<text class="s" x="229.0" y="255.0" text-anchor="start" dominant-baseline="central">observers</text>
<text class="ms" x="290.7" y="255.0" text-anchor="start" dominant-baseline="central">beforeSources</text>
<path d="M215.0 308 V342" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="229.0" y="325.0" text-anchor="start" dominant-baseline="central">обработаны готовые источники</text>
<path d="M215.0 378 V412" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="229.0" y="395.0" text-anchor="start" dominant-baseline="central">observers</text>
<text class="ms" x="290.7" y="395.0" text-anchor="start" dominant-baseline="central">beforeWaiting</text>
<path d="M215.0 448 V482" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="229.0" y="465.0" text-anchor="start" dominant-baseline="central">таймер / порт / main queue / тайм-аут</text>
<path d="M215.0 518 V552" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="229.0" y="535.0" text-anchor="start" dominant-baseline="central">observers</text>
<text class="ms" x="290.7" y="535.0" text-anchor="start" dominant-baseline="central">afterWaiting</text>
<path d="M215.0 588 V622" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="229.0" y="605.0" text-anchor="start" dominant-baseline="central">stop / нет источников / тайм-аут</text>
<text class="s" x="314" y="430.0" text-anchor="start" dominant-baseline="central">поток спит, CPU около 0</text>
<path d="M300 570.0 H670 V150.0 H304" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="660" y="360.0" text-anchor="end" dominant-baseline="central">обработали то, что разбудило</text>
<path d="M215.0 658 V685" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="229.0" y="671.5" text-anchor="start" dominant-baseline="central">observers</text>
<text class="ms" x="290.7" y="671.5" text-anchor="start" dominant-baseline="central">exit</text>
<circle cx="215.0" cy="694" r="9" fill="none" stroke="#a4a6b0" stroke-width="1.5"/>
<circle cx="215.0" cy="694" r="6" fill="#a4a6b0"/>
</svg>
