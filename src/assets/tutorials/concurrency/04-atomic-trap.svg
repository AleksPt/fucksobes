<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img">
<title>Atomic: read-modify-write не атомарен</title>
<desc>Диаграмма последовательности. Thread 1 делает get и получает 0. Thread 2 делает get и тоже получает 0. Thread 1 делает set 1. Thread 2 делает set 1. Заметка у queue: каждая операция атомарна, но read-modify-write нет.</desc>
