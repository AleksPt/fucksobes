<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img">
<title>Источники событий RunLoop</title>
<desc>Input sources (касания, порты, custom, performSelector) и Timer sources (Timer, afterDelay) поступают в Run Loop внутри Thread; Run Loop уведомляет observers и вызывает обработчики handlePort, customSrc, mySelector, timerFired.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="290" rx="16" fill="#14151c"/>
<rect x="24" y="30" width="230" height="90" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="139" y="52" text-anchor="middle" dominant-baseline="central">Input sources</text>
<text class="s" x="139" y="76" text-anchor="middle" dominant-baseline="central">касания, порты, custom</text>
<text class="ms" x="139" y="98" text-anchor="middle" dominant-baseline="central">performSelector</text>
<rect x="24" y="170" width="230" height="80" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="139" y="196" text-anchor="middle" dominant-baseline="central">Timer sources</text>
<text class="ms" x="139" y="222" text-anchor="middle" dominant-baseline="central">Timer, afterDelay</text>
<rect x="300" y="30" width="120" height="220" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="360" y="54" text-anchor="middle" dominant-baseline="central">Thread</text>
<circle cx="360" cy="140" r="44" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360" y="140" text-anchor="middle" dominant-baseline="central">Run Loop</text>
<path d="M254 75 H277 V140 H314" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M254 210 H277 V140 H314" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M404 140 H443 V75 H466" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M404 140 H443 V205 H466" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="466" y="50" width="230" height="50" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="581.0" y="75.0" text-anchor="middle" dominant-baseline="central">Notify observers</text>
<rect x="466" y="160" width="230" height="92" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
