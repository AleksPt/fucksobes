<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img">
<title>Своя асинхронная операция</title>
<desc>Диаграмма последовательности: OperationQueue вызывает start() у AsyncOperation; операция переходит в state executing и шлёт KVO isExecuting; отправляет запрос с колбэком в Сеть; start() уже вернул управление, но операция ещё не finished; Сеть отвечает; операция ставит state finished и шлёт KVO isExecuting и isFinished; затем сообщает очереди, что можно запускать зависимые операции.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="440" rx="16" fill="#14151c"/>
<rect x="45.0" y="24" width="150" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="120" y="42" text-anchor="middle" dominant-baseline="central">OperationQueue</text>
<line x1="120" y1="60" x2="120" y2="416" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="285.0" y="24" width="150" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="360" y="42" text-anchor="middle" dominant-baseline="central">AsyncOperation</text>
<line x1="360" y1="60" x2="360" y2="416" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="597.0" y="24" width="96" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="645" y="42" text-anchor="middle" dominant-baseline="central">Сеть</text>
<line x1="645" y1="60" x2="645" y2="416" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M120 100 L356 100" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="240.0" y="88" text-anchor="middle" dominant-baseline="central">start()</text>
<path d="M360 130 H396 V166 H364" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="406" y="140" text-anchor="start" dominant-baseline="central">state = executing</text>
<text class="ms" x="406" y="156" text-anchor="start" dominant-baseline="central">KVO isExecuting</text>
<path d="M360 200 L641 200" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="502.5" y="188" text-anchor="middle" dominant-baseline="central">запрос с колбэком</text>
<rect x="235" y="222" width="250" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="360.0" y="239.0" text-anchor="middle" dominant-baseline="central">start() уже вернул управление,</text>
<text class="s" x="360.0" y="257.0" text-anchor="middle" dominant-baseline="central">но операция ещё НЕ finished</text>
<path d="M645 304 L364 304" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="502.5" y="292" text-anchor="middle" dominant-baseline="central">ответ</text>
<path d="M360 328 H396 V364 H364" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="406" y="338" text-anchor="start" dominant-baseline="central">state = finished</text>
<text class="ms" x="406" y="354" text-anchor="start" dominant-baseline="central">KVO isExecuting / isFinished</text>
<path d="M360 394 L124 394" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="240.0" y="382" text-anchor="middle" dominant-baseline="central">можно запускать зависимые операции</text>
</svg>
