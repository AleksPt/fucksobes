<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img">
<title>Архитектура GCD</title>
<desc>Три колонки слева направо: ваш код (задачи 1, 2, 3), очереди DispatchQueue (main serial, global concurrent, custom serial или concurrent) и пул потоков под управлением системы (Main thread и три Thread). Задача 1 идёт в main, задача 2 в global, задача 3 в custom. Main отдаёт работу Main thread, global двум потокам, custom одному потоку.</desc>
