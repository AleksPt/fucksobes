<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456" role="img">
<title>Одно ядро и несколько ядер</title>
<desc>Верхняя схема: одно ядро Core 1 по очереди выполняет Thread 1, Thread 2, Thread 3, Thread 1, Thread 2 (context switch на границах). Нижняя схема: три ядра работают одновременно, Thread 1 на Core 1 от 0 до 10, Thread 2 на Core 2 от 0 до 7, Thread 3 на Core 3 от 1 до 9.</desc>
