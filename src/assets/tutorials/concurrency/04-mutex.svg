<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img">
<title>Mutex: два потока борются за замок</title>
<desc>Диаграмма последовательности. Thread 1 вызывает lock() у Mutex и захватывает его. Thread 2 вызывает lock(): занято, поток засыпает. Thread 1 в критической секции, затем unlock(). Mutex будит Thread 2, тот захватывает замок, проходит критическую секцию и вызывает unlock().</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="470" rx="16" fill="#14151c"/>
<rect x="60.0" y="24" width="120" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="120" y="42.0" text-anchor="middle" dominant-baseline="central">Thread 1</text>
<line x1="120" y1="60" x2="120" y2="446" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="300.0" y="24" width="120" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360" y="42.0" text-anchor="middle" dominant-baseline="central">Mutex</text>
<line x1="360" y1="60" x2="360" y2="446" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="540.0" y="24" width="120" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="600" y="42.0" text-anchor="middle" dominant-baseline="central">Thread 2</text>
<line x1="600" y1="60" x2="600" y2="446" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M120 110 L356 110" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="240.0" y="98" text-anchor="middle" dominant-baseline="central">lock(): захвачен</text>
<path d="M600 160 L364 160" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="480.0" y="148" text-anchor="middle" dominant-baseline="central">lock(): занято, спим</text>
<rect x="40" y="190" width="160" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="120.0" y="208.0" text-anchor="middle" dominant-baseline="central">критическая секция</text>
<path d="M120 265 L356 265" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="240.0" y="253" text-anchor="middle" dominant-baseline="central">unlock()</text>
<path d="M360 315 L596 315" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="480.0" y="303" text-anchor="middle" dominant-baseline="central">пробуждение, lock(): захвачен</text>
<rect x="520" y="345" width="160" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="600.0" y="363.0" text-anchor="middle" dominant-baseline="central">критическая секция</text>
<path d="M600 420 L364 420" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="480.0" y="408" text-anchor="middle" dominant-baseline="central">unlock()</text>
</svg>
