<svg xmlns="http://www.w3.org/2000/svg" width="720" height="394" viewBox="0 0 720 394" role="img">
<title>Custom concurrent queue + barrier</title>
<desc>Диаграмма временных полос, ось времени 0-10. До барьера: Task 1 с 0 до 3, Task 2 с 0 до 4, Task 3 с 1 до 4. Barrier task выполняется одна с 4 до 6. После барьера: Task 5 с 6 до 8, Task 6 с 6 до 10, Task 7 с 7 до 9.</desc>
