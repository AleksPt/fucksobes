<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img">
<title>Инверсия приоритетов</title>
<desc>Диаграмма временных полос. Low захватывает ресурс (0-2). High вытесняет Low и работает (2-3). В T3 High пытается взять занятый ресурс и ждёт (3-6), пока Low дорабатывает и освобождает его. В T4 (6) High получает ресурс и выполняется (6-8). Промежуток T3-T4 и есть инверсия.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="304" rx="16" fill="#14151c"/>
<text class="h" x="24" y="36" text-anchor="start" dominant-baseline="central">Инверсия приоритетов: T3-T4 высокий приоритет стоит</text>
<text class="t" x="16" y="112.0" text-anchor="start" dominant-baseline="central">High</text>
<line x1="72" y1="144" x2="704.0" y2="144" stroke="#fff" stroke-opacity="0.08"/>
<text class="t" x="16" y="192.0" text-anchor="start" dominant-baseline="central">Low</text>
<line x1="72" y1="224" x2="704.0" y2="224" stroke="#fff" stroke-opacity="0.08"/>
<rect x="230.0" y="80" width="79.0" height="64" rx="8" fill="#fff" fill-opacity="0.20" stroke="#fff" stroke-opacity="0.30"/>
<rect x="309.0" y="80" width="237.0" height="64" rx="8" fill="none" fill-opacity="0" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="427.5" y="112.0" text-anchor="middle" dominant-baseline="central">Ждёт ресурс - ИНВЕРСИЯ</text>
<rect x="546.0" y="80" width="158.0" height="64" rx="8" fill="#fff" fill-opacity="0.20" stroke="#fff" stroke-opacity="0.30"/>
<text class="t" x="625.0" y="112.0" text-anchor="middle" dominant-baseline="central">Ресурс получен</text>
<rect x="72.0" y="160" width="158.0" height="64" rx="8" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="151.0" y="192.0" text-anchor="middle" dominant-baseline="central">Захватил ресурс</text>
<rect x="309.0" y="160" width="237.0" height="64" rx="8" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="427.5" y="192.0" text-anchor="middle" dominant-baseline="central">Дорабатывает и освобождает</text>
<line x1="72" y1="240" x2="704.0" y2="240" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<line x1="72.0" y1="236" x2="72.0" y2="244" stroke="#a4a6b0"/>
<text class="s" x="72.0" y="258" text-anchor="middle" dominant-baseline="central">T1</text>
<line x1="230.0" y1="236" x2="230.0" y2="244" stroke="#a4a6b0"/>
<text class="s" x="230.0" y="258" text-anchor="middle" dominant-baseline="central">T2</text>
<line x1="309.0" y1="236" x2="309.0" y2="244" stroke="#a4a6b0"/>
<text class="s" x="309.0" y="258" text-anchor="middle" dominant-baseline="central">T3</text>
<line x1="546.0" y1="236" x2="546.0" y2="244" stroke="#a4a6b0"/>
<text class="s" x="546.0" y="258" text-anchor="middle" dominant-baseline="central">T4</text>
<text class="s" x="704.0" y="278" text-anchor="end" dominant-baseline="central">время</text>
<rect x="72" y="271" width="24" height="14" rx="4" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="104" y="278" text-anchor="start" dominant-baseline="central">выполняется</text>
<rect x="216" y="271" width="24" height="14" rx="4" fill="none" fill-opacity="0" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="248" y="278" text-anchor="start" dominant-baseline="central">ожидание ресурса</text>
<text class="s" x="269.5" y="96" text-anchor="middle" dominant-baseline="central">Вытеснил</text>
<text class="s" x="269.5" y="112" text-anchor="middle" dominant-baseline="central">Low,</text>
<text class="s" x="269.5" y="128" text-anchor="middle" dominant-baseline="central">работает</text>
</svg>
