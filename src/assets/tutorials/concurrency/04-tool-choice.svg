<svg xmlns="http://www.w3.org/2000/svg" width="720" height="652" viewBox="0 0 720 652" role="img">
<title>Выбор инструмента синхронизации</title>
<desc>Дерево решений. От узла Нужно защитить общее состояние идут вопросы сверху вниз. Новый код на Swift Concurrency: да, actor. Чтений намного больше, чем записей: да, concurrent queue + barrier. Нужно ограничить число задач до N: да, DispatchSemaphore(value: N). Короткая критическая секция и важна скорость: да, os_unfair_lock / NSLock, затем вопрос, берётся ли замок рекурсивно: да, NSRecursiveLock; если на четвёртый вопрос нет, serial DispatchQueue.</desc>
