<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img">
<title>Выбор таймера по потоку</title>
<desc>Вопрос «На каком потоке?»: на main используется Timer.scheduledTimer и RunLoop.main.add(timer, forMode: .common); на своём Thread создаётся Timer(timeInterval:repeats:), добавляется в RunLoop.current в режиме .common и вызывается RunLoop.current.run(); если не важно (фон), берут DispatchSourceTimer, он не зависит от RunLoop (см. тутор 02).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="500" rx="16" fill="#14151c"/>
<rect x="280" y="24" width="160" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="44.0" text-anchor="middle" dominant-baseline="central">Нужен таймер</text>
<path d="M360 64 V110" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M360 110 L470 150 L360 190 L250 150 Z" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360" y="150" text-anchor="middle" dominant-baseline="central">На каком потоке?</text>
<rect x="190" y="228" width="506" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<path d="M250 150 H60 V256.0 H188" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="190" y="310" width="506" height="84" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<path d="M250 150 H60 V352.0 H188" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="190" y="422" width="506" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<path d="M250 150 H60 V450.0 H188" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="110.6" y="244" text-anchor="start" dominant-baseline="central">main</text>
<text class="s" x="88.3" y="340" text-anchor="start" dominant-baseline="central">свой</text>
<text class="ms" x="118.5" y="340" text-anchor="start" dominant-baseline="central">Thread</text>
<text class="s" x="84.05000000000001" y="438" text-anchor="start" dominant-baseline="central">не важно, фон</text>
<text class="m" x="210" y="248" text-anchor="start" dominant-baseline="central">Timer.scheduledTimer</text>
<text class="m" x="210" y="270" text-anchor="start" dominant-baseline="central">+ RunLoop.main.add(timer, forMode: .common)</text>
<text class="m" x="210" y="332" text-anchor="start" dominant-baseline="central">Timer(timeInterval:repeats:)</text>
<text class="m" x="210" y="354" text-anchor="start" dominant-baseline="central">RunLoop.current.add(timer, forMode: .common)</text>
<text class="m" x="210" y="376" text-anchor="start" dominant-baseline="central">RunLoop.current.run()</text>
<text class="m" x="210" y="442" text-anchor="start" dominant-baseline="central">DispatchSourceTimer</text>
<text class="t" x="377.6" y="442" text-anchor="start" dominant-baseline="central">— не зависит от RunLoop</text>
<text class="s" x="210" y="464" text-anchor="start" dominant-baseline="central">(см. тутор 02)</text>
</svg>
