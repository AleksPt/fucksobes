<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img">
<title>sync и async между очередями</title>
<desc>Диаграмма последовательности для queue1 (текущая) и queue2. Queue1 выполняет задачи 1 и 2. Блок sync: queue1 вызывает queue2.sync с задачей 3, заблокирована и ждёт, queue2 отвечает, что задача 3 выполнена. Затем задача 4 в queue1. Блок async: queue1 вызывает queue2.async с задачей 3 и сразу выполняет задачу 4, а задача 3 идёт в queue2 параллельно.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="540" rx="16" fill="#14151c"/>
<rect x="75.0" y="24" width="150" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="150" y="42.0" text-anchor="middle" dominant-baseline="central">queue1 - текущая</text>
<line x1="150" y1="60" x2="150" y2="516" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="492.0" y="24" width="96" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="540" y="42.0" text-anchor="middle" dominant-baseline="central">queue2</text>
<line x1="540" y1="60" x2="540" y2="516" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="80" y="76" width="140" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="150.0" y="92.0" text-anchor="middle" dominant-baseline="central">задачи 1 и 2</text>
<rect x="24" y="124" width="672" height="172" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="40" y="136" width="64" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="72.0" y="150.0" text-anchor="middle" dominant-baseline="central">sync</text>
<path d="M150 190 L536 190" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="345.0" y="178" text-anchor="middle" dominant-baseline="central">queue2.sync { }</text>
<text class="s" x="345.0" y="206" text-anchor="middle" dominant-baseline="central">задача 3</text>
<rect x="65" y="226" width="170" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="150.0" y="242.0" text-anchor="middle" dominant-baseline="central">заблокирована, ждёт</text>
<path d="M540 276 L154 276" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="345.0" y="264" text-anchor="middle" dominant-baseline="central">задача 3 выполнена</text>
<rect x="80" y="312" width="140" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="150.0" y="328.0" text-anchor="middle" dominant-baseline="central">задача 4</text>
<rect x="24" y="360" width="672" height="140" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="40" y="372" width="64" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="72.0" y="386.0" text-anchor="middle" dominant-baseline="central">async</text>
<path d="M150 426 L536 426" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="345.0" y="414" text-anchor="middle" dominant-baseline="central">queue2.async { }</text>
<text class="s" x="345.0" y="442" text-anchor="middle" dominant-baseline="central">задача 3</text>
<rect x="75" y="458" width="150" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="150.0" y="474.0" text-anchor="middle" dominant-baseline="central">сразу задача 4</text>
<rect x="445" y="458" width="190" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="540.0" y="474.0" text-anchor="middle" dominant-baseline="central">задача 3 параллельно</text>
</svg>
