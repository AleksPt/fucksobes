<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img">
<title>Уровни API для работы с потоками</title>
<desc>Снизу вверх: Mach threads (самый низкий уровень, ядро ОС), POSIX threads pthread (C API, стандарт UNIX), NSThread / Thread (Foundation, ООП-обёртка), GCD DispatchQueue (очереди вместо потоков). Над GCD два варианта: Operation / OperationQueue (ООП над GCD) и Swift Concurrency (async/await, Task, actor).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="500" rx="16" fill="#14151c"/>
<rect x="180" y="420" width="360" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="438.0" text-anchor="middle" dominant-baseline="central">Mach threads</text>
<text class="s" x="360.0" y="459.0" text-anchor="middle" dominant-baseline="central">самый низкий уровень, ядро ОС</text>
<rect x="180" y="320" width="360" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="338.0" text-anchor="middle" dominant-baseline="central">POSIX threads - pthread</text>
<text class="s" x="360.0" y="359.0" text-anchor="middle" dominant-baseline="central">C API, стандарт UNIX</text>
<path d="M360 420 V380" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="180" y="220" width="360" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="238.0" text-anchor="middle" dominant-baseline="central">NSThread / Thread</text>
<text class="s" x="360.0" y="259.0" text-anchor="middle" dominant-baseline="central">Foundation, ООП-обёртка</text>
<path d="M360 320 V280" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="180" y="120" width="360" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="138.0" text-anchor="middle" dominant-baseline="central">GCD - DispatchQueue</text>
<text class="s" x="360.0" y="159.0" text-anchor="middle" dominant-baseline="central">очереди вместо потоков</text>
<path d="M360 220 V180" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="40" y="20" width="300" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="190.0" y="38.0" text-anchor="middle" dominant-baseline="central">Operation / OperationQueue</text>
<text class="s" x="190.0" y="59.0" text-anchor="middle" dominant-baseline="central">ООП над GCD</text>
<rect x="380" y="20" width="300" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="530.0" y="38.0" text-anchor="middle" dominant-baseline="central">Swift Concurrency</text>
<text class="s" x="530.0" y="59.0" text-anchor="middle" dominant-baseline="central">async/await, Task, actor</text>
<path d="M360 120 V98 H190 V80" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M360 120 V98 H530 V80" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>
