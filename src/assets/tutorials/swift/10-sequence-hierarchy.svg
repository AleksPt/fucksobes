<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img">
<title>Иерархия протоколов коллекций</title>
<desc>Sequence, от него Collection. От Collection наследуются BidirectionalCollection, MutableCollection и RangeReplaceableCollection. От BidirectionalCollection наследуется RandomAccessCollection, его принимает Array.</desc>
