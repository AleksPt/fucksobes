<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" role="img">
<title>Existential container для any Shape</title>
<desc>Контейнер из пяти слов, 40 байт: три слова буфера, указатель на метаданные типа и указатель на protocol witness table.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="312" rx="16" fill="#14151c"/>
<rect x="40" y="28" width="104" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="92.0" y="42.0" text-anchor="middle" dominant-baseline="central">any Shape</text>
<text class="b" x="160" y="42" text-anchor="start" dominant-baseline="central">экзистенциальный контейнер, 64-бит, один протокол</text>
<path d="M40 112 V104 H304 V112" fill="none" stroke="#5c5e6a" stroke-width="1.5"/>
<text class="s" x="172" y="92" text-anchor="middle" dominant-baseline="central">значение или указатель на кучу</text>
<rect x="40" y="120" width="440" height="64" rx="8" fill="#1b1c24"/>
<path d="M304 120 H472 a8 8 0 0 1 8 8 V176 a8 8 0 0 1 -8 8 H304 Z" fill="#272832"/>
<line x1="128" y1="120" x2="128" y2="184" stroke="#fff" stroke-opacity="0.12"/>
<line x1="216" y1="120" x2="216" y2="184" stroke="#fff" stroke-opacity="0.12"/>
<line x1="304" y1="120" x2="304" y2="184" stroke="#fff" stroke-opacity="0.12"/>
<line x1="392" y1="120" x2="392" y2="184" stroke="#fff" stroke-opacity="0.12"/>
<rect x="40" y="120" width="440" height="64" rx="8" fill="none" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="84.0" y="144" text-anchor="middle" dominant-baseline="central">buffer 1</text>
<text class="s" x="84.0" y="166" text-anchor="middle" dominant-baseline="central">слово 1</text>
<text class="m" x="172.0" y="144" text-anchor="middle" dominant-baseline="central">buffer 2</text>
<text class="s" x="172.0" y="166" text-anchor="middle" dominant-baseline="central">слово 2</text>
<text class="m" x="260.0" y="144" text-anchor="middle" dominant-baseline="central">buffer 3</text>
<text class="s" x="260.0" y="166" text-anchor="middle" dominant-baseline="central">слово 3</text>
<text class="m" x="348.0" y="144" text-anchor="middle" dominant-baseline="central">metadata</text>
<text class="s" x="348.0" y="166" text-anchor="middle" dominant-baseline="central">слово 4</text>
<text class="m" x="436.0" y="144" text-anchor="middle" dominant-baseline="central">witness</text>
