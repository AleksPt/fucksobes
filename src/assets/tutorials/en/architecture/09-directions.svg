<svg xmlns="http://www.w3.org/2000/svg" width="720" height="236" viewBox="0 0 720 236" role="img">
<title>Bidirectional and unidirectional architectures</title>
<desc>In the bidirectional one, View, ViewModel and Model exchange data in both directions. In the unidirectional one, the View sends an Intent or Request for processing, and the processing returns a State or Response to the View.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
.s,.b{font-weight:500}</style></defs>
<rect width="720" height="236" rx="16" fill="#14151c"/>
<text class="s" x="24" y="28" text-anchor="start" dominant-baseline="central">Bidirectional</text>
<rect x="24" y="44" width="120" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="84.0" y="72.0" text-anchor="middle" dominant-baseline="central">View</text>
<rect x="300" y="44" width="120" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="360.0" y="72.0" text-anchor="middle" dominant-baseline="central">ViewModel</text>
<rect x="576" y="44" width="120" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="636.0" y="72.0" text-anchor="middle" dominant-baseline="central">Model</text>
<path d="M148 72 H296" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M424 72 H572" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="24" y1="120" x2="696" y2="120" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="24" y="144" text-anchor="start" dominant-baseline="central">Unidirectional</text>
<rect x="24" y="160" width="120" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="84.0" y="188.0" text-anchor="middle" dominant-baseline="central">View</text>
<rect x="300" y="160" width="120" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360.0" y="188.0" text-anchor="middle" dominant-baseline="central">Processing</text>
<path d="M148 176 H296" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="222" y="164" text-anchor="middle" dominant-baseline="central">Intent / Request</text>
<path d="M296 202 H148" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="222" y="190" text-anchor="middle" dominant-baseline="central">State / Response</text>
</svg>