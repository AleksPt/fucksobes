<text class="t" x="109.0" y="46.0" text-anchor="middle" dominant-baseline="central">Client</text>
<rect x="274" y="24" width="170" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="359.0" y="46.0" text-anchor="middle" dominant-baseline="central">Proxy</text>
