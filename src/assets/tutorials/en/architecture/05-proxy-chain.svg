<svg xmlns="http://www.w3.org/2000/svg" width="720" height="92" viewBox="0 0 720 92" role="img">
<title>Proxy: a stand-in between the client and the service</title>
<desc>The client talks to the Proxy, and the Proxy passes the call to the real service.</desc>
