<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" role="img">
<title>Dependency inversion: before and after</title>
<desc>Left, before: LoginViewController depends directly on LoginInteractor. Right, after: LoginViewController depends on the LoginInteractorProtocol protocol and LoginInteractor implements it, so the dependency arrow is reversed.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
.s,.b{font-weight:500}</style></defs>
<rect width="720" height="396" rx="16" fill="#14151c"/>
<rect x="24" y="24" width="320" height="348" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="48" y="44" width="64" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="80.0" y="58.0" text-anchor="middle" dominant-baseline="central">Before</text>
<rect x="56" y="96" width="256" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="184.0" y="112.0" text-anchor="middle" dominant-baseline="central">LoginViewController</text>
<text class="s" x="184.0" y="133.0" text-anchor="middle" dominant-baseline="central">high level</text>
<path d="M184 152 V272" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="196" y="212" text-anchor="start" dominant-baseline="central">depends on a class</text>
<rect x="56" y="276" width="256" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="184.0" y="292.0" text-anchor="middle" dominant-baseline="central">LoginInteractor</text>
<text class="s" x="184.0" y="313.0" text-anchor="middle" dominant-baseline="central">low level</text>
<text class="b" x="48" y="348" text-anchor="start" dominant-baseline="central">High level knows low level</text>
<rect x="376" y="24" width="320" height="348" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="400" y="44" width="80" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="440.0" y="58.0" text-anchor="middle" dominant-baseline="central">After</text>
<rect x="408" y="96" width="256" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="536.0" y="112.0" text-anchor="middle" dominant-baseline="central">LoginViewController</text>
<text class="s" x="536.0" y="133.0" text-anchor="middle" dominant-baseline="central">high level</text>
<path d="M536 152 V182" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="548" y="167" text-anchor="start" dominant-baseline="central">uses</text>
<rect x="408" y="186" width="256" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="536.0" y="202.0" text-anchor="middle" dominant-baseline="central">LoginInteractorProtocol</text>
<text class="s" x="536.0" y="223.0" text-anchor="middle" dominant-baseline="central">abstraction</text>
<path d="M536 272 V242" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="548" y="257" text-anchor="start" dominant-baseline="central">implements</text>
<rect x="408" y="276" width="256" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="536.0" y="292.0" text-anchor="middle" dominant-baseline="central">LoginInteractor</text>
<text class="s" x="536.0" y="313.0" text-anchor="middle" dominant-baseline="central">low level</text>
<text class="b" x="400" y="348" text-anchor="start" dominant-baseline="central">Low level adapts to the protocol</text>
</svg>
