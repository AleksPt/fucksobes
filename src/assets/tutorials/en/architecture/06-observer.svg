<svg xmlns="http://www.w3.org/2000/svg" width="720" height="212" viewBox="0 0 720 212" role="img">
<title>Observer: one publisher and three subscribers</title>
<desc>The publisher sends notifications to three subscribers: Subscriber 1, Subscriber 2 and Subscriber 3.</desc>
