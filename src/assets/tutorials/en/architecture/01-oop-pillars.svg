<rect x="372" y="120" width="150" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="447.0" y="142.0" text-anchor="middle" dominant-baseline="central">Inheritance</text>
<path d="M360 68 V94 H447 V116" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="540" y="120" width="150" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="615.0" y="142.0" text-anchor="middle" dominant-baseline="central">Polymorphism</text>
