<svg xmlns="http://www.w3.org/2000/svg" width="720" height="188" viewBox="0 0 720 188" role="img">
<title>The four pillars of OOP</title>
<desc>Four arrows lead from the OOP block: encapsulation, abstraction, inheritance and polymorphism.</desc>
