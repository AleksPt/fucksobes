<rect x="24" y="64" width="140" height="72" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="94.0" y="100.0" text-anchor="middle" dominant-baseline="central">ViewController</text>
<rect x="300" y="64" width="120" height="72" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="360.0" y="100.0" text-anchor="middle" dominant-baseline="central">Interactor</text>
<rect x="576" y="64" width="120" height="72" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
