<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img">
<title>Clean Swift: the Request, Response, ViewModel ring</title>
<desc>The ViewController sends a Request to the Interactor. The Interactor hands a Response to the Presenter. The Presenter returns a ViewModel to the ViewController. The ViewController calls the Router, and the Interactor works with the Worker.</desc>
