<text class="s" x="232" y="88" text-anchor="middle" dominant-baseline="central">Request</text>
<path d="M424 100 H572" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="498" y="88" text-anchor="middle" dominant-baseline="central">Response</text>
<path d="M636 60 V32 H94 V60" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="360" y="20" text-anchor="middle" dominant-baseline="central">ViewModel</text>
