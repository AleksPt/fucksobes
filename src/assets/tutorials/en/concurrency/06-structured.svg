<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img">
<title>Structured and unstructured concurrency</title>
<desc>Structured: the root Task spawns async let image1, async let image2 and withTaskGroup; withTaskGroup spawns three group.addTask. Unstructured, not connected to the tree: Task.detached and Task { } from elsewhere.</desc>
