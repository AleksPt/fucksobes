<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img">
<title>A cycle in the dependency graph</title>
<desc>Queue 1 contains the chain Op1, Op2, Op3. Queue 2 contains Op5. Op2 waits for Op5 (an arrow from Op5 to Op2), Op5 waits for Op3 (a dashed arrow from Op3 to Op5). Op2, Op3, Op5 are highlighted: a cycle has formed.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="350" rx="16" fill="#14151c"/>
<rect x="20" y="20" width="680" height="120" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="44" y="44" text-anchor="start" dominant-baseline="central">Queue 1</text>
<rect x="20" y="200" width="680" height="130" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="44" y="224" text-anchor="start" dominant-baseline="central">Queue 2</text>
<rect x="90" y="70" width="100" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="140.0" y="92.0" text-anchor="middle" dominant-baseline="central">Op1</text>
<rect x="310" y="70" width="100" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="360.0" y="92.0" text-anchor="middle" dominant-baseline="central">Op2</text>
<rect x="530" y="70" width="100" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="580.0" y="92.0" text-anchor="middle" dominant-baseline="central">Op3</text>
<rect x="310" y="250" width="100" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="360.0" y="272.0" text-anchor="middle" dominant-baseline="central">Op5</text>
<path d="M190 92 H306" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M410 92 H526" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M360 250 V118" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="348" y="176" text-anchor="end" dominant-baseline="central">Op2 waits for Op5</text>
<path d="M580 114 V272 H414" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="497" y="290" text-anchor="middle" dominant-baseline="central">Op5 waits for Op3, CYCLE</text>
</svg>
