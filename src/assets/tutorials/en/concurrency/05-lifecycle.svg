<svg xmlns="http://www.w3.org/2000/svg" width="720" height="484" viewBox="0 0 720 484" role="img">
<title>Life cycle of a sync and an async operation</title>
<desc>Two rows. Sync: isReady, isExecuting, isFinished; all the work in main; example code: let op = MdDocumentDownloadOperation(url) and op.start(). Async: isReady, isExecuting, an asynchronous task, isFinished; start returned, finish on the callback; example: let queue = OperationQueue() and queue.addOperation(MdDocumentDownloadOperation(url: url)).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="484" rx="16" fill="#14151c"/>
<rect x="20" y="20" width="680" height="206" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="40" y="36" width="80" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="80.0" y="50.0" text-anchor="middle" dominant-baseline="central">Sync</text>
<rect x="40" y="78" width="100" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="90.0" y="100.0" text-anchor="middle" dominant-baseline="central">isReady</text>
<rect x="190" y="78" width="130" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="255.0" y="100.0" text-anchor="middle" dominant-baseline="central">isExecuting</text>
<rect x="370" y="78" width="120" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="430.0" y="100.0" text-anchor="middle" dominant-baseline="central">isFinished</text>
<path d="M140 100 H186" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M320 100 H366" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="255.0" y="138" text-anchor="middle" dominant-baseline="central">(all work in main)</text>
<rect x="40" y="158" width="500" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="ms" x="56" y="175" text-anchor="start" dominant-baseline="central">let op = MdDocumentDownloadOperation(url)</text>
<text class="ms" x="56" y="195" text-anchor="start" dominant-baseline="central">op.start()</text>
<rect x="20" y="246" width="680" height="218" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="40" y="262" width="80" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="80.0" y="276.0" text-anchor="middle" dominant-baseline="central">Async</text>
<rect x="40" y="304" width="100" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="90.0" y="326.0" text-anchor="middle" dominant-baseline="central">isReady</text>
<rect x="190" y="304" width="130" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="255.0" y="326.0" text-anchor="middle" dominant-baseline="central">isExecuting</text>
<rect x="370" y="304" width="110" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="m" x="425.0" y="326.0" text-anchor="middle" dominant-baseline="central">async task</text>
<rect x="530" y="304" width="120" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="590.0" y="326.0" text-anchor="middle" dominant-baseline="central">isFinished</text>
<path d="M140 326 H186" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M320 326 H366" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M480 326 H526" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="255.0" y="364" text-anchor="middle" dominant-baseline="central">(start returned,</text>
<text class="s" x="255.0" y="380" text-anchor="middle" dominant-baseline="central">finish on the callback)</text>
<rect x="40" y="396" width="500" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="ms" x="56" y="413" text-anchor="start" dominant-baseline="central">let queue = OperationQueue()</text>
<text class="ms" x="56" y="433" text-anchor="start" dominant-baseline="central">queue.addOperation(MdDocumentDownloadOperation(url: url))</text>
</svg>
