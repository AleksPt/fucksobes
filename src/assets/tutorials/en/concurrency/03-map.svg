<text class="t" x="592" y="135" text-anchor="middle" dominant-baseline="central">Thread management</text>
<text class="t" x="592" y="153" text-anchor="middle" dominant-baseline="central">mistakes</text>
<path d="M502 172 V230.0 H516" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="516" y="208" width="180" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="606" y="230.0" text-anchor="middle" dominant-baseline="central">Priority inversion</text>
