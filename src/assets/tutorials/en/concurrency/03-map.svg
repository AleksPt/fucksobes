<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" role="img">
<title>A map of concurrency problems</title>
<desc>The root "Concurrency problems" splits into three groups. Uncertainty of parallelism: data race, race condition, actor reentrancy. Side effects of synchronization: deadlock, livelock, resource contention and performance penalty. Thread management mistakes: priority inversion, starvation, thread explosion.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="408" rx="16" fill="#14151c"/>
<rect x="230" y="24" width="260" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360" y="46" text-anchor="middle" dominant-baseline="central">Concurrency problems</text>
<path d="M360 68 V92 H128 V116" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="24" y="116" width="208" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="128" y="135" text-anchor="middle" dominant-baseline="central">Uncertainty</text>
<text class="t" x="128" y="153" text-anchor="middle" dominant-baseline="central">of parallelism</text>
<path d="M38 172 V230.0 H52" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="52" y="208" width="180" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="142" y="230.0" text-anchor="middle" dominant-baseline="central">Data race</text>
<path d="M38 172 V290.0 H52" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="52" y="268" width="180" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="142" y="290.0" text-anchor="middle" dominant-baseline="central">Race condition</text>
<path d="M38 172 V350.0 H52" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="52" y="328" width="180" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="142" y="350.0" text-anchor="middle" dominant-baseline="central">Actor reentrancy</text>
