<svg xmlns="http://www.w3.org/2000/svg" width="720" height="664" viewBox="0 0 720 664" role="img">
<title>Continuations: one pool thread and suspension at an await</title>
<desc>At the top, a sequence diagram: one pool thread runs Continuation 1 up to an await, it suspends and the thread is free, then the thread runs Continuations 2 and 3, and finally returns to Continuation 1 and continues from where it stopped. At the bottom, a comparison: in GCD with blocking, each waiting task has its own thread; in Swift Concurrency one thread runs C1, C2, C3 in turn.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="664" rx="16" fill="#14151c"/>
<rect x="25.0" y="24" width="150" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="100" y="42.0" text-anchor="middle" dominant-baseline="central">One pool thread</text>
<line x1="100" y1="60" x2="100" y2="352" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="265.0" y="24" width="130" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="330" y="42.0" text-anchor="middle" dominant-baseline="central">Continuation 1</text>
<line x1="330" y1="60" x2="330" y2="352" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="415.0" y="24" width="130" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="480" y="42.0" text-anchor="middle" dominant-baseline="central">Continuation 2</text>
<line x1="480" y1="60" x2="480" y2="352" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="565.0" y="24" width="130" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="630" y="42.0" text-anchor="middle" dominant-baseline="central">Continuation 3</text>
<line x1="630" y1="60" x2="630" y2="352" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M100 96 L326 96" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="215.0" y="84" text-anchor="middle" dominant-baseline="central">run up to the await</text>
<path d="M330 136 L104 136" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="215.0" y="124" text-anchor="middle" dominant-baseline="central">suspended - the thread is free</text>
<path d="M100 176 L476 176" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="290.0" y="164" text-anchor="middle" dominant-baseline="central">run another task</text>
<path d="M480 216 L104 216" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="290.0" y="204" text-anchor="middle" dominant-baseline="central">await</text>
<path d="M100 256 L626 256" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="365.0" y="244" text-anchor="middle" dominant-baseline="central">one more</text>
<path d="M630 296 L104 296" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="365.0" y="284" text-anchor="middle" dominant-baseline="central">done</text>
<text class="s" x="215.0" y="326" text-anchor="middle" dominant-baseline="central">the result arrived</text>
<path d="M100 348 L326 348" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="215.0" y="362" text-anchor="middle" dominant-baseline="central">continue from where we stopped</text>
<rect x="24" y="396" width="672" height="244" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="48" y="416" width="200" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="148.0" y="430.0" text-anchor="middle" dominant-baseline="central">GCD + blocking</text>
<rect x="392" y="416" width="240" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="512.0" y="430.0" text-anchor="middle" dominant-baseline="central">Swift Concurrency</text>
<text class="ms" x="48" y="480" text-anchor="start" dominant-baseline="central">Thread A</text>
<rect x="122" y="464" width="210" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="227" y="480" text-anchor="middle" dominant-baseline="central">task1  waits  task1</text>
<text class="ms" x="48" y="524" text-anchor="start" dominant-baseline="central">Thread B</text>
<rect x="122" y="508" width="210" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="227" y="524" text-anchor="middle" dominant-baseline="central">task2  waits  task2</text>
<text class="ms" x="48" y="568" text-anchor="start" dominant-baseline="central">Thread C</text>
<rect x="122" y="552" width="210" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="227" y="568" text-anchor="middle" dominant-baseline="central">task3  waits  task3</text>
<text class="s" x="48" y="606" text-anchor="start" dominant-baseline="central">a thread for every waiting task</text>
<text class="ms" x="392" y="480" text-anchor="start" dominant-baseline="central">Thread A</text>
<rect x="392" y="494" width="42" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="413" y="510" text-anchor="middle" dominant-baseline="central">C1</text>
<rect x="442" y="494" width="42" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="463" y="510" text-anchor="middle" dominant-baseline="central">C2</text>
<rect x="492" y="494" width="42" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="513" y="510" text-anchor="middle" dominant-baseline="central">C3</text>
<rect x="542" y="494" width="42" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="563" y="510" text-anchor="middle" dominant-baseline="central">C1</text>
<rect x="592" y="494" width="42" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="613" y="510" text-anchor="middle" dominant-baseline="central">C2</text>
<text class="m" x="646" y="510" text-anchor="start" dominant-baseline="central">...</text>
<path d="M508 572 V534" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="392" y="586" text-anchor="start" dominant-baseline="central">switching between continuations</text>
<text class="s" x="392" y="606" text-anchor="start" dominant-baseline="central">without blocking a thread</text>
</svg>
