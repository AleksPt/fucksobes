<svg xmlns="http://www.w3.org/2000/svg" width="720" height="526" viewBox="0 0 720 526" role="img">
<title>Processes and threads</title>
<desc>Two processes: app A with three threads and app B with two. The threads of each process are connected to that process's shared memory. Between processes there is only IPC (a dashed link).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="526" rx="16" fill="#14151c"/>
<rect x="16" y="16" width="688" height="220" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<text class="h" x="40" y="46" text-anchor="start" dominant-baseline="central">Process: app A</text>
<rect x="36.0" y="76" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="136.0" y="94.0" text-anchor="middle" dominant-baseline="central">Main thread</text>
<text class="s" x="136.0" y="115.0" text-anchor="middle" dominant-baseline="central">own stack</text>
<line x1="136.0" y1="132" x2="136.0" y2="172" stroke="#fff" stroke-opacity="0.45"/>
<rect x="260.0" y="76" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="94.0" text-anchor="middle" dominant-baseline="central">Thread 2</text>
<text class="s" x="360.0" y="115.0" text-anchor="middle" dominant-baseline="central">own stack</text>
<line x1="360.0" y1="132" x2="360.0" y2="172" stroke="#fff" stroke-opacity="0.45"/>
<rect x="484.0" y="76" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="584.0" y="94.0" text-anchor="middle" dominant-baseline="central">Thread 3</text>
<text class="s" x="584.0" y="115.0" text-anchor="middle" dominant-baseline="central">own stack</text>
<line x1="584.0" y1="132" x2="584.0" y2="172" stroke="#fff" stroke-opacity="0.45"/>
<rect x="36" y="172" width="648" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360.0" y="194.0" text-anchor="middle" dominant-baseline="central">Shared process memory</text>
<rect x="16" y="290" width="688" height="220" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<text class="h" x="40" y="320" text-anchor="start" dominant-baseline="central">Process: app B</text>
<rect x="148.0" y="350" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="248.0" y="378.0" text-anchor="middle" dominant-baseline="central">Main thread</text>
<line x1="248.0" y1="406" x2="248.0" y2="446" stroke="#fff" stroke-opacity="0.45"/>
<rect x="372.0" y="350" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="472.0" y="378.0" text-anchor="middle" dominant-baseline="central">Thread 2</text>
<line x1="472.0" y1="406" x2="472.0" y2="446" stroke="#fff" stroke-opacity="0.45"/>
<rect x="36" y="446" width="648" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360.0" y="468.0" text-anchor="middle" dominant-baseline="central">Shared process memory</text>
<line x1="360" y1="236" x2="360" y2="290" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="372" y="263" text-anchor="start" dominant-baseline="central">IPC only</text>
</svg>
