<svg xmlns="http://www.w3.org/2000/svg" width="720" height="476" viewBox="0 0 720 476" role="img">
<title>The timer freezes while scrolling</title>
<desc>A sequence: RunLoop.main sends ticks to the timer in the .default mode; the user starts scrolling, the mode changes to .tracking, the timer doesn't fire; the user lifts the finger, the mode returns to .default, the ticks resume.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="476" rx="16" fill="#14151c"/>
<rect x="40.0" y="24" width="160" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="120" y="42" text-anchor="middle" dominant-baseline="central">User</text>
<line x1="120" y1="60" x2="120" y2="460" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="280.0" y="24" width="160" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="360" y="42" text-anchor="middle" dominant-baseline="central">RunLoop.main</text>
<line x1="360" y1="60" x2="360" y2="460" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="505.0" y="24" width="190" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="600" y="42" text-anchor="middle" dominant-baseline="central">Timer in .default</text>
<line x1="600" y1="60" x2="600" y2="460" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M360 110 L596 110" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="423.5" y="98" text-anchor="start" dominant-baseline="central">.default</text>
<text class="s" x="486.1" y="98" text-anchor="start" dominant-baseline="central">tick, tick</text>
<path d="M120 170 L356 170" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="240.0" y="158" text-anchor="middle" dominant-baseline="central">started scrolling</text>
<rect x="265.0" y="200" width="190" height="34" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="306.2" y="217" text-anchor="start" dominant-baseline="central">mode:</text>
<text class="ms" x="349.0" y="217" text-anchor="start" dominant-baseline="central">.tracking</text>
<rect x="505.0" y="250" width="190" height="34" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="533.85" y="267" text-anchor="start" dominant-baseline="central">the timer doesn't fire</text>
<path d="M120 330 L356 330" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="240.0" y="318" text-anchor="middle" dominant-baseline="central">lifted the finger</text>
<rect x="265.0" y="360" width="190" height="34" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="309.8" y="377" text-anchor="start" dominant-baseline="central">mode:</text>
<text class="ms" x="352.6" y="377" text-anchor="start" dominant-baseline="central">.default</text>
<path d="M360 430 L596 430" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="480.0" y="418" text-anchor="middle" dominant-baseline="central">ticks resumed</text>
</svg>
