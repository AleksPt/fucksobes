<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456" role="img">
<title>Data race: a lost increment</title>
<desc>A sequence diagram. Thread 1 and Thread 2 both read count = 0, each computes 0 + 1 = 1, then both write 1. The result: 1, not 2.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="456" rx="16" fill="#14151c"/>
<rect x="68.0" y="24" width="104" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="120" y="42.0" text-anchor="middle" dominant-baseline="central">Thread 1</text>
<line x1="120" y1="60" x2="120" y2="432" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="295.0" y="24" width="130" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="360" y="42.0" text-anchor="middle" dominant-baseline="central">count = 0</text>
<line x1="360" y1="60" x2="360" y2="432" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="548.0" y="24" width="104" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="600" y="42.0" text-anchor="middle" dominant-baseline="central">Thread 2</text>
<line x1="600" y1="60" x2="600" y2="432" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M120 100 L356 100" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="240.0" y="88" text-anchor="middle" dominant-baseline="central">read, got 0</text>
<path d="M600 140 L364 140" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="480.0" y="128" text-anchor="middle" dominant-baseline="central">read, got 0</text>
<path d="M120 180 H156 V204 H124" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="166" y="192.0" text-anchor="start" dominant-baseline="central">0 + 1 = 1</text>
<path d="M600 224 H564 V248 H596" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="554" y="236" text-anchor="end" dominant-baseline="central">0 + 1 = 1</text>
<path d="M120 292 L356 292" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="240.0" y="280" text-anchor="middle" dominant-baseline="central">write 1</text>
<path d="M600 332 L364 332" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="480.0" y="320" text-anchor="middle" dominant-baseline="central">write 1</text>
<rect x="190" y="364" width="340" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="360.0" y="383.0" text-anchor="middle" dominant-baseline="central">Result: 1, not 2.</text>
<text class="s" x="360.0" y="401.0" text-anchor="middle" dominant-baseline="central">"But you added to me twice..."</text>
</svg>
