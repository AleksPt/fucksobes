<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img">
<title>Deadlock: sync onto the same serial queue</title>
<desc>In serialQueue there are task A, inside which sync is called with task B, and then task B itself. A waits for B, but B can't start until A finishes, because the queue is serial. The result: deadlock.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="300" rx="16" fill="#14151c"/>
<text class="m" x="24" y="88" text-anchor="start" dominant-baseline="central">serialQueue</text>
<rect x="140" y="60" width="320" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="300.0" y="78.0" text-anchor="middle" dominant-baseline="central">task A</text>
<text class="s" x="300.0" y="99.0" text-anchor="middle" dominant-baseline="central">... sync { B } ...</text>
<rect x="500" y="60" width="120" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="560.0" y="88.0" text-anchor="middle" dominant-baseline="central">B</text>
<path d="M300 116 V168 H560 V120" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="430" y="154" text-anchor="middle" dominant-baseline="central">waits for B</text>
<text class="b" x="360" y="214" text-anchor="middle" dominant-baseline="central">B can't start until A finishes (serial!)</text>
<text class="b" x="360" y="238" text-anchor="middle" dominant-baseline="central">A won't finish until B runs</text>
<rect x="300" y="256" width="120" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360.0" y="270.0" text-anchor="middle" dominant-baseline="central">DEADLOCK</text>
</svg>
