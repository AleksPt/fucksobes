<svg xmlns="http://www.w3.org/2000/svg" width="720" height="564" viewBox="0 0 720 564" role="img">
<title>Serial and concurrent queues</title>
<desc>Two timelines from 0 to 11. Serial: Task 0 from 0 to 3, Task 1 from 3 to 5, Task 2 from 5 to 9, Task 3 from 9 to 11, strictly one after another. Concurrent: Task 0 from 0 to 6, Task 1 from 1 to 4, Task 2 from 2 to 9, Task 3 from 3 to 5, the tasks overlap; they start in order and finish in any order.</desc>
