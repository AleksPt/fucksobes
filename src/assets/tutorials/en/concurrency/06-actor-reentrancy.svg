<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img">
<title>Actor reentrancy</title>
<desc>A sequence diagram: withdraw(80) passes the guard 100 &gt;= 80 and suspends at await log; withdraw(90) enters the free actor and also passes the guard 100 &gt;= 90 and waits at await log; then W1 sets balance = 20, and W2 sets balance = -70, which is a bug.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="420" rx="16" fill="#14151c"/>
<rect x="25.0" y="24" width="150" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="100" y="42.0" text-anchor="middle" dominant-baseline="central">withdraw(80)</text>
<line x1="100" y1="60" x2="100" y2="396" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="235.0" y="24" width="250" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360" y="42.0" text-anchor="middle" dominant-baseline="central">actor Account - balance 100</text>
<line x1="360" y1="60" x2="360" y2="396" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="545.0" y="24" width="150" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="620" y="42.0" text-anchor="middle" dominant-baseline="central">withdraw(90)</text>
<line x1="620" y1="60" x2="620" y2="396" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M100 108 L356 108" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="230.0" y="96" text-anchor="middle" dominant-baseline="central">guard 100 &gt;= 80 (ok)</text>
<path d="M100 156 L356 156" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="230.0" y="144" text-anchor="middle" dominant-baseline="central">await log - suspension</text>
<path d="M620 204 L364 204" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="490.0" y="192" text-anchor="middle" dominant-baseline="central">guard 100 &gt;= 90 (ok) - actor is free</text>
<path d="M620 252 L364 252" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="490.0" y="240" text-anchor="middle" dominant-baseline="central">await log</text>
<path d="M100 300 L356 300" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="230.0" y="288" text-anchor="middle" dominant-baseline="central">balance = 20</text>
<path d="M620 348 L364 348" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="490.0" y="336" text-anchor="middle" dominant-baseline="central">balance = -70 (bug)</text>
</svg>
