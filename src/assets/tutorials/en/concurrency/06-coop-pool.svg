<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img">
<title>Cooperative thread pool</title>
<desc>On the left, tasks Task 1-4 and Task N; on the right, the cooperative pool with a thread count about equal to the number of cores: Thread 1, 2, 3. Task 1, 2, 3 go with solid arrows to Thread 1, 2, 3; Task 4 with a dashed arrow to Thread 1, Task N with a dashed arrow to Thread 2. The main thread is outside the pool, it is @MainActor.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="404" rx="16" fill="#14151c"/>
<rect x="24" y="24" width="250" height="352" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<text class="h" x="48" y="56" text-anchor="start" dominant-baseline="central">Tasks</text>
<text class="s" x="48" y="78" text-anchor="start" dominant-baseline="central">Task / continuation</text>
<rect x="48" y="96" width="202" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="149.0" y="116.0" text-anchor="middle" dominant-baseline="central">Task 1</text>
<rect x="48" y="150" width="202" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="149.0" y="170.0" text-anchor="middle" dominant-baseline="central">Task 2</text>
<rect x="48" y="204" width="202" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="149.0" y="224.0" text-anchor="middle" dominant-baseline="central">Task 3</text>
<rect x="48" y="258" width="202" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="149.0" y="278.0" text-anchor="middle" dominant-baseline="central">Task 4</text>
<rect x="48" y="312" width="202" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="149.0" y="332.0" text-anchor="middle" dominant-baseline="central">Task N</text>
