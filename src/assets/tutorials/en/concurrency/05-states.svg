<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img">
<title>Operation states</title>
<desc>The Operation state diagram: created and added to a queue, Pending; once dependencies are done, Ready; start() moves it to Executing; when the work is done, Finished; from Pending, Ready and Executing, on cancel() (for Executing, if the operation checks isCancelled), a transition to Cancelled; from Cancelled, leaving main or start leads to Finished; Finished is removed from the queue.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="372" rx="16" fill="#14151c"/>
<circle cx="110" cy="28" r="6" fill="#fff"/>
<path d="M110 34 V90" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="124" y="56" text-anchor="start" dominant-baseline="central">created / added to a queue</text>
<rect x="50" y="90" width="120" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="110.0" y="112.0" text-anchor="middle" dominant-baseline="central">Pending</text>
<rect x="270" y="90" width="120" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="330.0" y="112.0" text-anchor="middle" dominant-baseline="central">Ready</text>
<rect x="500" y="90" width="120" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="560.0" y="112.0" text-anchor="middle" dominant-baseline="central">Executing</text>
<path d="M170 112 H266" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="220" y="84" text-anchor="middle" dominant-baseline="central">dependencies</text>
<text class="s" x="220" y="100" text-anchor="middle" dominant-baseline="central">done</text>
<path d="M390 112 H496" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="443" y="100" text-anchor="middle" dominant-baseline="central">start()</text>
<rect x="270" y="250" width="120" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="m" x="330.0" y="272.0" text-anchor="middle" dominant-baseline="central">Cancelled</text>
<rect x="500" y="250" width="120" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="560.0" y="272.0" text-anchor="middle" dominant-baseline="central">Finished</text>
<path d="M110 134 V180 H290 V246" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="200" y="168" text-anchor="middle" dominant-baseline="central">cancel()</text>
<path d="M330 134 V246" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="338" y="156" text-anchor="start" dominant-baseline="central">cancel()</text>
<path d="M520 134 V180 H370 V246" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="445" y="168" text-anchor="middle" dominant-baseline="central">cancel()</text>
<text class="s" x="445" y="196" text-anchor="middle" dominant-baseline="central">if the operation checks</text>
<text class="ms" x="445" y="214" text-anchor="middle" dominant-baseline="central">isCancelled</text>
<path d="M560 134 V246" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="572" y="192" text-anchor="start" dominant-baseline="central">work completed</text>
<path d="M390 272 H496" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="443" y="260" text-anchor="middle" dominant-baseline="central">exit from</text>
<text class="ms" x="443" y="288" text-anchor="middle" dominant-baseline="central">main / start</text>
<path d="M560 294 V334" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="572" y="316" text-anchor="start" dominant-baseline="central">removed from the queue</text>
<circle cx="560" cy="342" r="6" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="560" cy="342" r="3" fill="#fff"/>
</svg>
