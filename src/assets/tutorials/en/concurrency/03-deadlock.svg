<svg xmlns="http://www.w3.org/2000/svg" width="720" height="652" viewBox="0 0 720 652" role="img">
<title>Deadlock: tasks A and B, resources X and Y</title>
<desc>A sequence diagram: task A (low) acquires resource X, then task B (high) preempts A, acquires Y, tries to take X and waits, A tries to take Y and waits. A waits for B, B waits for A: deadlock. Below is the wait-for graph: A holds X and waits for Y, B holds Y and waits for X, a wait cycle.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="652" rx="16" fill="#14151c"/>
<rect x="25.0" y="24" width="150" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="100" y="42.0" text-anchor="middle" dominant-baseline="central">Task A (low)</text>
<line x1="100" y1="60" x2="100" y2="356" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="210.0" y="24" width="110" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="265" y="42.0" text-anchor="middle" dominant-baseline="central">Resource X</text>
<line x1="265" y1="60" x2="265" y2="356" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="400.0" y="24" width="110" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="455" y="42.0" text-anchor="middle" dominant-baseline="central">Resource Y</text>
<line x1="455" y1="60" x2="455" y2="356" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="550.0" y="24" width="150" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="625" y="42.0" text-anchor="middle" dominant-baseline="central">Task B (high)</text>
<line x1="625" y1="60" x2="625" y2="356" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M100 100 L261 100" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="182.5" y="88" text-anchor="middle" dominant-baseline="central">T1: lock X, success</text>
<rect x="25" y="124" width="670" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="360.0" y="140.0" text-anchor="middle" dominant-baseline="central">T2: B preempts A</text>
<path d="M625 190 L459 190" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="540.0" y="178" text-anchor="middle" dominant-baseline="central">T3: lock Y, success</text>
<path d="M625 236 L269 236" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="360" y="224" text-anchor="middle" dominant-baseline="central">T4: lock X - busy, B waits</text>
<path d="M100 282 L451 282" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="360" y="270" text-anchor="middle" dominant-baseline="central">T5: lock Y - busy, A waits</text>
<rect x="25" y="316" width="670" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360" y="336" text-anchor="middle" dominant-baseline="central">A waits for B, B waits for A - DEADLOCK</text>
<rect x="24" y="384" width="672" height="244" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="80" y="414" width="64" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="112" y="436" text-anchor="middle" dominant-baseline="central">A</text>
<rect x="300" y="414" width="120" height="44" rx="22" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360" y="436" text-anchor="middle" dominant-baseline="central">Resource X</text>
<rect x="576" y="414" width="64" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="608" y="436" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="300" y="524" width="120" height="44" rx="22" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360" y="546" text-anchor="middle" dominant-baseline="central">Resource Y</text>
<path d="M146 436 H296" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="221" y="422" text-anchor="middle" dominant-baseline="central">holds</text>
<path d="M574 436 H424" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="499" y="422" text-anchor="middle" dominant-baseline="central">waits</text>
<path d="M112 460 V546 H296" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="204" y="532" text-anchor="middle" dominant-baseline="central">waits</text>
<path d="M608 460 V546 H424" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="516" y="532" text-anchor="middle" dominant-baseline="central">holds</text>
<text class="b" x="360" y="600" text-anchor="middle" dominant-baseline="central">A wait cycle - nobody will ever continue</text>
</svg>
