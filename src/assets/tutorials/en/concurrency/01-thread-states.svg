<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img">
<title>Thread life cycle</title>
<desc>A start point; creating Thread() leads to New. start() moves it to Runnable. The scheduler hands out a core: Runnable to Running; a context switch or an expired time slice: Running back to Runnable. From Running, on waiting for I/O, a lock or sleep, the thread goes to Blocked and returns to Runnable on the event. When the code finishes, Running moves to Terminated, then the end.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="420" rx="16" fill="#14151c"/>
<circle cx="111" cy="26" r="6" fill="#fff"/>
<path d="M111 32 V58" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="121" y="45" text-anchor="start" dominant-baseline="central">Thread()</text>
<rect x="56" y="60" width="110" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="111.0" y="88.0" text-anchor="middle" dominant-baseline="central">New</text>
<path d="M166 88 H278" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="222" y="76" text-anchor="middle" dominant-baseline="central">start()</text>
<rect x="280" y="60" width="110" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="335.0" y="88.0" text-anchor="middle" dominant-baseline="central">Runnable</text>
<rect x="594" y="60" width="110" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="649.0" y="88.0" text-anchor="middle" dominant-baseline="central">Running</text>
<path d="M390 76 H592" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="492" y="62" text-anchor="middle" dominant-baseline="central">scheduler gave a core</text>
<path d="M594 100 H392" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="492" y="114" text-anchor="middle" dominant-baseline="central">context switch / time slice expired</text>
<rect x="300" y="190" width="120" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="360.0" y="218.0" text-anchor="middle" dominant-baseline="central">Blocked</text>
<path d="M600 116 V218 H422" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="511" y="206" text-anchor="middle" dominant-baseline="central">waits for I/O, lock, sleep</text>
<path d="M360 190 V118" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="350" y="153" text-anchor="end" dominant-baseline="central">event occurred</text>
<rect x="594" y="290" width="110" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="649.0" y="318.0" text-anchor="middle" dominant-baseline="central">Terminated</text>
<path d="M670 116 V288" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="662" y="262" text-anchor="end" dominant-baseline="central">code finished</text>
<path d="M649 346 V380" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<circle cx="649" cy="392" r="9" fill="none" stroke="#fff"/><circle cx="649" cy="392" r="5" fill="#fff"/>
</svg>
