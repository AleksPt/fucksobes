<svg xmlns="http://www.w3.org/2000/svg" width="720" height="556" viewBox="0 0 720 556" role="img">
<title>DispatchGroup</title>
<desc>A sequence diagram: Code, DispatchGroup, Background tasks. The code calls enter() five times, the counter is 5; starts 5 downloads; subscribes via notify(queue:). The background tasks call leave() five times, the counter goes down 4, 3, 2, 1, 0. Then DispatchGroup calls the notify block in the code.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="556" rx="16" fill="#14151c"/>
<rect x="82.0" y="24" width="96" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="130" y="42.0" text-anchor="middle" dominant-baseline="central">Code</text>
<line x1="130" y1="60" x2="130" y2="540" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="510.0" y="24" width="160" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="590" y="42.0" text-anchor="middle" dominant-baseline="central">Background tasks</text>
<line x1="590" y1="60" x2="590" y2="540" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="289" y="24" width="142" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="360" y="42" text-anchor="middle" dominant-baseline="central">DispatchGroup</text>
<line x1="360" y1="60" x2="360" y2="540" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M130 100 L356 100" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="245.0" y="88" text-anchor="middle" dominant-baseline="central">enter() x5</text>
<text class="s" x="245.0" y="114" text-anchor="middle" dominant-baseline="central">count 5</text>
<path d="M130 152 L586 152" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="475" y="140" text-anchor="middle" dominant-baseline="central">start 5 downloads</text>
<path d="M130 200 L356 200" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="245.0" y="188" text-anchor="middle" dominant-baseline="central">notify(queue:)</text>
<text class="s" x="245.0" y="214" text-anchor="middle" dominant-baseline="central">subscribe</text>
<path d="M590 256 L364 256" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="475.0" y="244" text-anchor="middle" dominant-baseline="central">leave()</text>
<text class="s" x="475" y="270" text-anchor="middle" dominant-baseline="central">count 4</text>
<path d="M590 304 L364 304" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="475.0" y="292" text-anchor="middle" dominant-baseline="central">leave()</text>
<text class="s" x="475" y="318" text-anchor="middle" dominant-baseline="central">count 3</text>
<path d="M590 352 L364 352" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="475.0" y="340" text-anchor="middle" dominant-baseline="central">leave()</text>
<text class="s" x="475" y="366" text-anchor="middle" dominant-baseline="central">count 2</text>
<path d="M590 400 L364 400" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="475.0" y="388" text-anchor="middle" dominant-baseline="central">leave()</text>
<text class="s" x="475" y="414" text-anchor="middle" dominant-baseline="central">count 1</text>
<path d="M590 448 L364 448" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="475.0" y="436" text-anchor="middle" dominant-baseline="central">leave()</text>
<text class="s" x="475" y="462" text-anchor="middle" dominant-baseline="central">count 0</text>
<path d="M360 504 L134 504" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="245.0" y="492" text-anchor="middle" dominant-baseline="central">notify</text>
<text class="s" x="245.0" y="518" text-anchor="middle" dominant-baseline="central">calls the block</text>
</svg>
