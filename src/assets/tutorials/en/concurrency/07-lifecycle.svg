<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" role="img">
<title>RunLoop life cycle</title>
<desc>The first access to RunLoop.current creates the RunLoop (Created); run() moves it to Running; with no events it goes to Sleeping and returns to Running on an event or a timer; with no sources, a stop or a timeout it moves to Finished, after which the thread ends.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="306" rx="16" fill="#14151c"/>
<circle cx="105" cy="30" r="6" fill="#a4a6b0"/>
<path d="M105 36 V60" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="119" y="46" text-anchor="start" dominant-baseline="central">first access to</text>
<text class="ms" x="239.39999999999998" y="46" text-anchor="start" dominant-baseline="central">RunLoop.current</text>
<rect x="40" y="60" width="130" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="105.0" y="80.0" text-anchor="middle" dominant-baseline="central">Created</text>
<rect x="300" y="60" width="130" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="365.0" y="80.0" text-anchor="middle" dominant-baseline="central">Running</text>
<rect x="560" y="60" width="130" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="625.0" y="80.0" text-anchor="middle" dominant-baseline="central">Sleeping</text>
<path d="M170 80 H300" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="217.0" y="66" text-anchor="start" dominant-baseline="central">run()</text>
<path d="M430 72 H560" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="495" y="58" text-anchor="middle" dominant-baseline="central">no events</text>
<path d="M560 90 H430" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="495" y="108" text-anchor="middle" dominant-baseline="central">event / timer</text>
<rect x="300" y="190" width="130" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="365.0" y="210.0" text-anchor="middle" dominant-baseline="central">Finished</text>
<path d="M365 100 V190" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="379" y="146" text-anchor="start" dominant-baseline="central">no sources / stop / timeout</text>
<path d="M365 230 V270" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="379" y="250" text-anchor="start" dominant-baseline="central">the thread ends</text>
<circle cx="365" cy="282" r="9" fill="none" stroke="#a4a6b0" stroke-width="1.5"/>
<circle cx="365" cy="282" r="6" fill="#a4a6b0"/>
</svg>
