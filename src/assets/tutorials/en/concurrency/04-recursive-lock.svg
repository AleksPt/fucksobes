<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img">
<title>NSRecursiveLock: acquisition counter</title>
<desc>A sequence diagram. One Thread and an NSRecursiveLock. lock(): counter 1. lock(): counter 2, the same owner, that's fine. unlock(): counter 1. lock(): counter 2. unlock(): counter 1. unlock(): counter 0, the lock is free for other threads.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="440" rx="16" fill="#14151c"/>
<rect x="60.0" y="24" width="120" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="120" y="42.0" text-anchor="middle" dominant-baseline="central">Thread</text>
<line x1="120" y1="60" x2="120" y2="416" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="420.0" y="24" width="200" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="520" y="42.0" text-anchor="middle" dominant-baseline="central">NSRecursiveLock</text>
<line x1="520" y1="60" x2="520" y2="416" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M120 110 L516 110" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="320.0" y="98" text-anchor="middle" dominant-baseline="central">lock(): count 1</text>
<path d="M120 166 L516 166" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="320.0" y="154" text-anchor="middle" dominant-baseline="central">lock(): count 2, same owner, OK</text>
<path d="M120 222 L516 222" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="320.0" y="210" text-anchor="middle" dominant-baseline="central">unlock(): count 1</text>
<path d="M120 278 L516 278" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="320.0" y="266" text-anchor="middle" dominant-baseline="central">lock(): count 2</text>
<path d="M120 334 L516 334" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="320.0" y="322" text-anchor="middle" dominant-baseline="central">unlock(): count 1</text>
<path d="M120 390 L516 390" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="320.0" y="378" text-anchor="middle" dominant-baseline="central">unlock(): count 0, free for others</text>
</svg>
