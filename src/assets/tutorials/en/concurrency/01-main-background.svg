<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img">
<title>Main thread and a background thread</title>
<desc>The user taps Download, the main thread starts the download on a background thread and stays free for scrolling, animations and touches. The background thread makes a network request and parses the response, returns the result to the main thread, and the main thread updates the user's screen.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="420" rx="16" fill="#14151c"/>
<rect x="20.0" y="24" width="140" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="90" y="42.0" text-anchor="middle" dominant-baseline="central">User</text>
<line x1="90" y1="60" x2="90" y2="396" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="220.0" y="24" width="140" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="290" y="42.0" text-anchor="middle" dominant-baseline="central">Main thread</text>
<line x1="290" y1="60" x2="290" y2="396" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="385.0" y="24" width="190" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="480" y="42.0" text-anchor="middle" dominant-baseline="central">Background thread</text>
<line x1="480" y1="60" x2="480" y2="396" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M90 100 L286 100" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="190.0" y="88" text-anchor="middle" dominant-baseline="central">Taps "Download"</text>
<path d="M290 150 L476 150" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="385.0" y="138" text-anchor="middle" dominant-baseline="central">Start the download</text>
<rect x="190" y="182" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="290.0" y="201.0" text-anchor="middle" dominant-baseline="central">Free: scrolling, animations,</text>
<text class="s" x="290.0" y="219.0" text-anchor="middle" dominant-baseline="central">reacting to touches</text>
<path d="M480 272 H510 V296 H484" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="520" y="284.0" text-anchor="start" dominant-baseline="central">Network request and parsing</text>
<path d="M480 340 L294 340" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="385.0" y="328" text-anchor="middle" dominant-baseline="central">Result is ready</text>
<path d="M290 384 L94 384" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="190.0" y="372" text-anchor="middle" dominant-baseline="central">Updated screen</text>
</svg>
