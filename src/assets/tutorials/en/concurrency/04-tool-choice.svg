<svg xmlns="http://www.w3.org/2000/svg" width="720" height="652" viewBox="0 0 720 652" role="img">
<title>Choosing a synchronization tool</title>
<desc>A decision tree. From the node "Need to protect shared state" the questions go from top to bottom. New code on Swift Concurrency: yes, actor. Far more reads than writes: yes, concurrent queue + barrier. Need to limit the number of tasks to N: yes, DispatchSemaphore(value: N). Short critical section and speed matters: yes, os_unfair_lock / NSLock, then the question of whether the lock is taken recursively: yes, NSRecursiveLock; if the fourth question is no, serial DispatchQueue.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="652" rx="16" fill="#14151c"/>
<rect x="40" y="24" width="300" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="190.0" y="44.0" text-anchor="middle" dominant-baseline="central">Need to protect shared state</text>
<rect x="40" y="104" width="300" height="56" rx="24" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="190.0" y="122.0" text-anchor="middle" dominant-baseline="central">New code on</text>
<text class="t" x="190.0" y="143.0" text-anchor="middle" dominant-baseline="central">Swift Concurrency?</text>
<rect x="40" y="200" width="300" height="56" rx="24" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="190.0" y="218.0" text-anchor="middle" dominant-baseline="central">Far more reads</text>
<text class="t" x="190.0" y="239.0" text-anchor="middle" dominant-baseline="central">than writes?</text>
<rect x="40" y="296" width="300" height="56" rx="24" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="190.0" y="314.0" text-anchor="middle" dominant-baseline="central">Need to limit</text>
<text class="t" x="190.0" y="335.0" text-anchor="middle" dominant-baseline="central">simultaneous tasks to N?</text>
<rect x="40" y="392" width="300" height="56" rx="24" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="190.0" y="410.0" text-anchor="middle" dominant-baseline="central">Short critical section,</text>
<text class="t" x="190.0" y="431.0" text-anchor="middle" dominant-baseline="central">speed matters?</text>
<path d="M190.0 64 V104" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M190.0 160 V200" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="198.0" y="182" text-anchor="start" dominant-baseline="central">no</text>
<path d="M190.0 256 V296" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="198.0" y="278" text-anchor="start" dominant-baseline="central">no</text>
<path d="M190.0 352 V392" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="198.0" y="374" text-anchor="start" dominant-baseline="central">no</text>
<rect x="430" y="112" width="260" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="560.0" y="132.0" text-anchor="middle" dominant-baseline="central">actor</text>
<path d="M340 132 H430" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="385.0" y="118" text-anchor="middle" dominant-baseline="central">yes</text>
<rect x="430" y="208" width="260" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="560.0" y="228.0" text-anchor="middle" dominant-baseline="central">concurrent queue + barrier</text>
<path d="M340 228 H430" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="385.0" y="214" text-anchor="middle" dominant-baseline="central">yes</text>
<rect x="430" y="304" width="260" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="560.0" y="324.0" text-anchor="middle" dominant-baseline="central">DispatchSemaphore(value: N)</text>
<path d="M340 324 H430" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="385.0" y="310" text-anchor="middle" dominant-baseline="central">yes</text>
<rect x="430" y="400" width="260" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="560.0" y="420.0" text-anchor="middle" dominant-baseline="central">os_unfair_lock / NSLock</text>
<path d="M340 420 H430" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="385.0" y="406" text-anchor="middle" dominant-baseline="central">yes</text>
<path d="M190.0 448 V488" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="198.0" y="468" text-anchor="start" dominant-baseline="central">no</text>
<rect x="40" y="488" width="300" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="190.0" y="510.0" text-anchor="middle" dominant-baseline="central">serial DispatchQueue</text>
<path d="M560.0 448 V488" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="430" y="488" width="260" height="56" rx="24" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="560.0" y="506.0" text-anchor="middle" dominant-baseline="central">Is the lock taken</text>
<text class="t" x="560.0" y="527.0" text-anchor="middle" dominant-baseline="central">recursively?</text>
<path d="M560.0 544 V584" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="568.0" y="564" text-anchor="start" dominant-baseline="central">yes</text>
<rect x="430" y="584" width="260" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="560.0" y="606.0" text-anchor="middle" dominant-baseline="central">NSRecursiveLock</text>
</svg>