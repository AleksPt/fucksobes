<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img">
<title>GCD architecture</title>
<desc>Three columns from left to right: your code (tasks 1, 2, 3), DispatchQueue queues (main serial, global concurrent, custom serial or concurrent) and a thread pool managed by the system (the main thread and three Threads). Task 1 goes to main, task 2 to global, task 3 to custom. Main hands the work to the main thread, global to two threads, custom to one thread.</desc>
