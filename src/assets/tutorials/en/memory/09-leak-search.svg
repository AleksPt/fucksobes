<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420" role="img">
<title>How to look for a leak</title>
<desc>Suspicion: memory is growing. print in deinit: not called - Debug Memory Graph, found a cycle, weak or unowned; called but memory is growing - Instruments Allocations and Mark Generation, a cache or collection with no limit.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="740" height="420" rx="16" fill="#14151c"/>
<rect x="230" y="20" width="280" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="370.0" y="36.0" text-anchor="middle" dominant-baseline="central">Suspicion</text>
<text class="s" x="370.0" y="57.0" text-anchor="middle" dominant-baseline="central">memory is growing</text>
<path d="M370 74 V100" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="230" y="102" width="280" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="370.0" y="124.0" text-anchor="middle" dominant-baseline="central">print in deinit</text>
<path d="M300 148 V170 H180 V206" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="172" y="190" text-anchor="end" dominant-baseline="central">not called</text>
<path d="M440 148 V170 H560 V206" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="568" y="190" text-anchor="start" dominant-baseline="central">called, but memory grows</text>
<rect x="40" y="208" width="280" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="180.0" y="226.0" text-anchor="middle" dominant-baseline="central">Debug Memory Graph</text>
<text class="s" x="180.0" y="247.0" text-anchor="middle" dominant-baseline="central">who holds the object?</text>
<rect x="420" y="208" width="280" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="560.0" y="226.0" text-anchor="middle" dominant-baseline="central">Instruments: Allocations</text>
<text class="s" x="560.0" y="247.0" text-anchor="middle" dominant-baseline="central">Mark Generation</text>
<path d="M180 266 V318" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M560 266 V318" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="40" y="320" width="280" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="t" x="180.0" y="338.0" text-anchor="middle" dominant-baseline="central">Found a cycle</text>
<text class="s" x="180.0" y="359.0" text-anchor="middle" dominant-baseline="central">weak / unowned</text>
<rect x="420" y="320" width="280" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="t" x="560.0" y="338.0" text-anchor="middle" dominant-baseline="central">A cache or collection</text>
<text class="s" x="560.0" y="359.0" text-anchor="middle" dominant-baseline="central">with no limit</text>
</svg>
