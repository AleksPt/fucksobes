<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img">
<title>An object's life in an autorelease pool</title>
<desc>The code creates an object with count 1 and sends autorelease: the object is in the pool, the count is still 1. When drained, the pool sends release, the count is 0, the object is freed.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="400" rx="16" fill="#14151c"/>
<rect x="25.0" y="20" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="110.0" y="38.0" text-anchor="middle" dominant-baseline="central">Code</text>
<line x1="110" y1="56" x2="110" y2="386" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="275.0" y="20" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="360.0" y="38.0" text-anchor="middle" dominant-baseline="central">Autorelease Pool</text>
<line x1="360" y1="56" x2="360" y2="386" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="525.0" y="20" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="610.0" y="38.0" text-anchor="middle" dominant-baseline="central">Object</text>
<line x1="610" y1="56" x2="610" y2="386" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M114 92 H606" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="360.0" y="80" text-anchor="middle" dominant-baseline="central">create (count 1)</text>
<path d="M114 140 H356" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="235.0" y="128" text-anchor="middle" dominant-baseline="central">obj.autorelease()</text>
<rect x="260" y="160" width="200" height="50" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="360.0" y="176" text-anchor="middle" dominant-baseline="central">the object is in the pool,</text>
<text class="s" x="360.0" y="194" text-anchor="middle" dominant-baseline="central">count is still 1</text>
<rect x="20" y="222" width="200" height="50" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="120.0" y="238" text-anchor="middle" dominant-baseline="central">the code keeps running,</text>
<text class="s" x="120.0" y="256" text-anchor="middle" dominant-baseline="central">the object is alive</text>
<path d="M364 298 H606" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="485.0" y="286" text-anchor="middle" dominant-baseline="central">pool drain: release</text>
<rect x="510" y="320" width="200" height="50" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="610.0" y="336" text-anchor="middle" dominant-baseline="central">count 0</text>
<text class="s" x="610.0" y="354" text-anchor="middle" dominant-baseline="central">object freed</text>
</svg>
