<rect x="48" y="92" width="272" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="64" y="112" text-anchor="start" dominant-baseline="central">p1</text>
<text class="m" x="304" y="112" text-anchor="end" dominant-baseline="central">x = 1</text>
<rect x="48" y="140" width="272" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="64" y="160" text-anchor="start" dominant-baseline="central">p2</text>
<text class="m" x="304" y="160" text-anchor="end" dominant-baseline="central">x = 99</text>
<text class="b" x="48" y="206" text-anchor="start" dominant-baseline="central">two independent copies</text>
<rect x="400" y="92" width="70" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="435" y="112" text-anchor="middle" dominant-baseline="central">b1</text>
<rect x="400" y="148" width="70" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="435" y="168" text-anchor="middle" dominant-baseline="central">b2</text>
<rect x="552" y="106" width="120" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="612.0" y="124.0" text-anchor="middle" dominant-baseline="central">Box</text>
<text class="s" x="612.0" y="145.0" text-anchor="middle" dominant-baseline="central">x = 99</text>
