<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440" role="img">
<title>Where a value type ends up</title>
<desc>A value type goes on the stack if all conditions hold; behind a protocol or Any, in an escaping closure, in a class field, in collection data, String and indirect enum it is on the heap. A class is usually on the heap; on the stack only as an optimization.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="740" height="440" rx="16" fill="#14151c"/>
<rect x="40" y="150" width="120" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="100.0" y="172.0" text-anchor="middle" dominant-baseline="central">Value type</text>
<rect x="40" y="330" width="120" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="100.0" y="352.0" text-anchor="middle" dominant-baseline="central">Class</text>
<rect x="600" y="24" width="100" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="650.0" y="42.0" text-anchor="middle" dominant-baseline="central">Stack</text>
<rect x="600" y="384" width="100" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="650.0" y="402.0" text-anchor="middle" dominant-baseline="central">Stack</text>
<rect x="600" y="90" width="100" height="256" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="650" y="218" text-anchor="middle" dominant-baseline="central">Heap</text>
<rect x="210" y="24" width="320" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="b" x="370.0" y="42" text-anchor="middle" dominant-baseline="central">all conditions met</text>
<path d="M530 42 H592" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="210" y="96" width="320" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="b" x="370.0" y="114" text-anchor="middle" dominant-baseline="central">hidden behind a protocol / Any</text>
<path d="M530 114 H592" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="210" y="144" width="320" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="b" x="370.0" y="162" text-anchor="middle" dominant-baseline="central">captured by an escaping closure</text>
<path d="M530 162 H592" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="210" y="192" width="320" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="b" x="370.0" y="210" text-anchor="middle" dominant-baseline="central">a class field</text>
<path d="M530 210 H592" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="210" y="240" width="320" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="b" x="370.0" y="258" text-anchor="middle" dominant-baseline="central">collections / String / indirect enum</text>
<path d="M530 258 H592" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="210" y="306" width="320" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="b" x="370.0" y="324" text-anchor="middle" dominant-baseline="central">usually</text>
<path d="M530 324 H592" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="210" y="384" width="320" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="b" x="370.0" y="402" text-anchor="middle" dominant-baseline="central">never leaves the function (optimization)</text>
<path d="M530 402 H592" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
