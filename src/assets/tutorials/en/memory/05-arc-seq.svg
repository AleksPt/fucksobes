<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img">
<title>How ARC inserts retain and release</title>
<desc>The code tells the compiler about let b = a, the compiler inserts swift_retain; at the end of the scope it inserts swift_release; the compiled code goes to the runtime, where the count changes while the app runs.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="320" rx="16" fill="#14151c"/>
<rect x="10.0" y="20" width="180" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="100.0" y="38.0" text-anchor="middle" dominant-baseline="central">Your code</text>
<line x1="100" y1="56" x2="100" y2="306" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="250.0" y="20" width="180" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="340.0" y="38.0" text-anchor="middle" dominant-baseline="central">Compiler</text>
<line x1="340" y1="56" x2="340" y2="306" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="490.0" y="20" width="180" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="580.0" y="38.0" text-anchor="middle" dominant-baseline="central">Runtime</text>
<line x1="580" y1="56" x2="580" y2="306" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M104 90 H336" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="220.0" y="78" text-anchor="middle" dominant-baseline="central">let b = a</text>
<path d="M344 108 H384 V128 H346" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="394" y="118" text-anchor="start" dominant-baseline="central">insert swift_retain</text>
<path d="M104 164 H336" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="220.0" y="152" text-anchor="middle" dominant-baseline="central">end of scope</text>
<path d="M344 182 H384 V202 H346" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="394" y="192" text-anchor="start" dominant-baseline="central">insert swift_release</text>
<path d="M344 238 H576" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="460.0" y="226" text-anchor="middle" dominant-baseline="central">compiled code</text>
<path d="M584 256 H624 V276 H586" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="570" y="266" text-anchor="end" dominant-baseline="central">the count changes at run time</text>
</svg>
