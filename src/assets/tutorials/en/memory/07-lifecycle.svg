<svg xmlns="http://www.w3.org/2000/svg" width="764" height="370" viewBox="0 0 764 370" role="img">
<title>Object lifecycle</title>
<desc>Live, Deiniting, Deinited, Freed, Dead. Transitions: strong = 0 calls deinit; Deiniting goes straight to Dead if there are no unowned references and no side table; otherwise to Deinited; then Dead or Freed; Freed goes to Dead when weak = 0.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="764" height="370" rx="16" fill="#14151c"/>
<rect x="24" y="90" width="116" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="82.0" y="112.0" text-anchor="middle" dominant-baseline="central">Live</text>
<rect x="174" y="90" width="116" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="232.0" y="112.0" text-anchor="middle" dominant-baseline="central">Deiniting</text>
<rect x="324" y="90" width="116" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="382.0" y="112.0" text-anchor="middle" dominant-baseline="central">Deinited</text>
<rect x="474" y="90" width="116" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="532.0" y="112.0" text-anchor="middle" dominant-baseline="central">Freed</text>
<rect x="624" y="90" width="116" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="682.0" y="112.0" text-anchor="middle" dominant-baseline="central">Dead</text>
<path d="M144 112 H170" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="159" y="96" text-anchor="middle" dominant-baseline="central">1</text>
<path d="M294 112 H320" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="309" y="96" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M444 112 H470" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="459" y="96" text-anchor="middle" dominant-baseline="central">3</text>
<path d="M594 112 H620" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="609" y="96" text-anchor="middle" dominant-baseline="central">4</text>
<path d="M232 90 V52 H682 V86" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="457" y="38" text-anchor="middle" dominant-baseline="central">no unowned, no Side Table</text>
<path d="M382 134 V176 H682 V138" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="532" y="192" text-anchor="middle" dominant-baseline="central">unowned = 0, no Side Table</text>
<text class="b" x="40" y="240" text-anchor="start" dominant-baseline="central">1  strong = 0, deinit is called</text>
<text class="b" x="40" y="268" text-anchor="start" dominant-baseline="central">2  has unowned or a Side Table</text>
<text class="b" x="40" y="296" text-anchor="start" dominant-baseline="central">3  unowned = 0, has a Side Table</text>
<text class="b" x="40" y="324" text-anchor="start" dominant-baseline="central">4  weak = 0</text>
</svg>
