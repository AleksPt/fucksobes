<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img">
<title>A variable on the stack, an object on the heap</title>
<desc>The example frame holds x, y, z and the reference object. The reference points to a MyClass object on the heap.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="250" rx="16" fill="#14151c"/>
<text class="s" x="40" y="28" text-anchor="start" dominant-baseline="central">Stack · frame of example()</text>
<text class="s" x="460" y="28" text-anchor="start" dominant-baseline="central">Heap</text>
<rect x="40" y="46" width="320" height="160" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="54" y="66.0" text-anchor="start" dominant-baseline="central">x = 1</text>
<line x1="40" y1="86" x2="360" y2="86" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="54" y="106.0" text-anchor="start" dominant-baseline="central">y = 2</text>
<line x1="40" y1="126" x2="360" y2="126" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="54" y="146.0" text-anchor="start" dominant-baseline="central">z = 3</text>
<line x1="40" y1="166" x2="360" y2="166" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="54" y="186.0" text-anchor="start" dominant-baseline="central">object</text>
<text class="ms" x="346" y="186.0" text-anchor="end" dominant-baseline="central">0x6000…</text>
<rect x="460" y="166" width="220" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="570.0" y="186.0" text-anchor="middle" dominant-baseline="central">MyClass</text>
<path d="M364 186 H452" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="40" y="232" text-anchor="start" dominant-baseline="central">only the reference (8 bytes) is on the stack, the object is on the heap</text>
</svg>