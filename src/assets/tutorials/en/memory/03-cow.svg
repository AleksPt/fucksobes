<svg xmlns="http://www.w3.org/2000/svg" width="720" height="376" viewBox="0 0 720 376" role="img">
<title>Copy-on-Write for an array</title>
<desc>First a and b point to one buffer, 2 owners. On b.append(4) there is more than one owner, so a copy is made and b gets its own buffer.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="376" rx="16" fill="#14151c"/>
<text class="t" x="40" y="24" text-anchor="start" dominant-baseline="central">var b = a: no copy yet</text>
<rect x="40" y="46" width="90" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="85" y="66" text-anchor="middle" dominant-baseline="central">a</text>
<rect x="40" y="106" width="90" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="85" y="126" text-anchor="middle" dominant-baseline="central">b</text>
<rect x="400" y="64" width="280" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="540.0" y="86.0" text-anchor="middle" dominant-baseline="central">[1, 2, 3]</text>
<text class="s" x="540" y="128" text-anchor="middle" dominant-baseline="central">buffer on the heap, owners: 2</text>
<path d="M134 66 L396 80" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M134 126 L396 96" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<line x1="40" y1="170" x2="680" y2="170" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="40" y="194" text-anchor="start" dominant-baseline="central">b.append(4): owners &gt; 1, so we copy</text>
<rect x="40" y="216" width="90" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="85" y="236" text-anchor="middle" dominant-baseline="central">a</text>
<rect x="40" y="286" width="90" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="85" y="306" text-anchor="middle" dominant-baseline="central">b</text>
<rect x="400" y="214" width="280" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="540.0" y="236.0" text-anchor="middle" dominant-baseline="central">[1, 2, 3]</text>
<rect x="400" y="284" width="280" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="m" x="540.0" y="306.0" text-anchor="middle" dominant-baseline="central">[1, 2, 3, 4]</text>
<path d="M134 236 H396" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M134 306 H396" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="540" y="346" text-anchor="middle" dominant-baseline="central">the copy is made only now: b has its own buffer</text>
</svg>
