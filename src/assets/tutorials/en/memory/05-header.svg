<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img">
<title>The reference count in the object header</title>
<desc>An object on the heap: a type pointer isa of 8 bytes, a reference count of 8 bytes (a bit field with strong, unowned, flags), then the object's properties.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="250" rx="16" fill="#14151c"/>
<text class="s" x="40" y="28" text-anchor="start" dominant-baseline="central">Heap · object</text>
<rect x="40" y="44" width="340" height="176" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<rect x="40" y="88" width="340" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<line x1="40" y1="88" x2="380" y2="88" stroke="#fff" stroke-opacity="0.12"/>
<line x1="40" y1="176" x2="380" y2="176" stroke="#fff" stroke-opacity="0.12"/>
<line x1="40" y1="132" x2="380" y2="132" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="54" y="66.0" text-anchor="start" dominant-baseline="central">type pointer (isa)</text>
<text class="s" x="366" y="66.0" text-anchor="end" dominant-baseline="central">8 bytes</text>
<text class="t" x="54" y="110.0" text-anchor="start" dominant-baseline="central">reference count</text>
<text class="s" x="366" y="110.0" text-anchor="end" dominant-baseline="central">8 bytes</text>
<text class="m" x="54" y="154.0" text-anchor="start" dominant-baseline="central">name</text>
<text class="s" x="366" y="154.0" text-anchor="end" dominant-baseline="central">object properties</text>
<text class="m" x="54" y="198.0" text-anchor="start" dominant-baseline="central">...</text>
<path d="M424 110.0 H384" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="434" y="100.0" text-anchor="start" dominant-baseline="central">bit field:</text>
<text class="s" x="434" y="120.0" text-anchor="start" dominant-baseline="central">strong, unowned, flags</text>
<text class="s" x="40" y="232" text-anchor="start" dominant-baseline="central">there is no separate region for counts, it lives in the object itself</text>
</svg>
