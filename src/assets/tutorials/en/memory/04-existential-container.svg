<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340" role="img">
<title>The existential container</title>
<desc>Five machine words, 40 bytes: three words of the value buffer, a pointer to the type metadata with the Value Witness Table, and a pointer to the Protocol Witness Table.</desc>
