<svg xmlns="http://www.w3.org/2000/svg" width="740" height="250" viewBox="0 0 740 250" role="img">
<title>HeapObject: a User object on the heap</title>
<desc>A 16-byte header: metadata (isa) and refCounts, 8 bytes each, then the properties id = 1 and score = 100, 8 bytes each.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="740" height="250" rx="16" fill="#14151c"/>
<text class="s" x="40" y="24" text-anchor="start" dominant-baseline="central">Heap · User object</text>
<rect x="40" y="44" width="300" height="176" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="54" y="66.0" text-anchor="start" dominant-baseline="central">metadata (isa)</text>
<text class="ms" x="326" y="66.0" text-anchor="end" dominant-baseline="central">8 B</text>
<line x1="40" y1="88" x2="340" y2="88" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="54" y="110.0" text-anchor="start" dominant-baseline="central">refCounts</text>
<text class="ms" x="326" y="110.0" text-anchor="end" dominant-baseline="central">8 B</text>
<line x1="40" y1="132" x2="340" y2="132" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="54" y="154.0" text-anchor="start" dominant-baseline="central">id = 1</text>
<text class="ms" x="326" y="154.0" text-anchor="end" dominant-baseline="central">8 B</text>
<line x1="40" y1="176" x2="340" y2="176" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="54" y="198.0" text-anchor="start" dominant-baseline="central">score = 100</text>
<text class="ms" x="326" y="198.0" text-anchor="end" dominant-baseline="central">8 B</text>
<line x1="40" y1="132" x2="340" y2="132" stroke="#fff" stroke-opacity="0.45"/>
<text class="b" x="360" y="60" text-anchor="start" dominant-baseline="central">who I am: a pointer to the class description</text>
<text class="b" x="360" y="116" text-anchor="start" dominant-baseline="central">how many owners I have</text>
<text class="b" x="360" y="154" text-anchor="start" dominant-baseline="central">object properties</text>
<text class="b" x="360" y="198" text-anchor="start" dominant-baseline="central">object properties</text>
