<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img">
<title>Content hugging: who stretches in a row</title>
<desc>Before: the label and the field both have hugging 250, either view can stretch, two outcomes. After: the label has 251, the field 250; the label keeps its size, the field stretches.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="480" height="320" rx="16" fill="#14151c"/>
<text class="s" x="24" y="28" text-anchor="start" dominant-baseline="central">Before: both hugging 250, ambiguous: either can stretch</text>
<rect x="24" y="48" width="298" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="173.0" y="60.0" text-anchor="middle" dominant-baseline="central">Name:</text>
<text class="s" x="173.0" y="81.0" text-anchor="middle" dominant-baseline="central">hugging 250</text>
<rect x="330" y="48" width="102" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="381.0" y="60.0" text-anchor="middle" dominant-baseline="central">field</text>
<text class="s" x="381.0" y="81.0" text-anchor="middle" dominant-baseline="central">hugging 250</text>
<text class="s" x="240.0" y="114" text-anchor="middle" dominant-baseline="central">or</text>
<rect x="24" y="130" width="96" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="72.0" y="142.0" text-anchor="middle" dominant-baseline="central">Name:</text>
<text class="s" x="72.0" y="163.0" text-anchor="middle" dominant-baseline="central">hugging 250</text>
<rect x="128" y="130" width="304" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="280.0" y="142.0" text-anchor="middle" dominant-baseline="central">field</text>
<text class="s" x="280.0" y="163.0" text-anchor="middle" dominant-baseline="central">hugging 250</text>
<line x1="24" y1="192" x2="456" y2="192" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="24" y="216" text-anchor="start" dominant-baseline="central">After: label 251, field 250</text>
<rect x="24" y="232" width="96" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="72.0" y="244.0" text-anchor="middle" dominant-baseline="central">Name:</text>
<text class="s" x="72.0" y="265.0" text-anchor="middle" dominant-baseline="central">hugging 251</text>
<rect x="128" y="232" width="304" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="280.0" y="244.0" text-anchor="middle" dominant-baseline="central">field</text>
<text class="s" x="280.0" y="265.0" text-anchor="middle" dominant-baseline="central">hugging 250</text>
<text class="s" x="24" y="300" text-anchor="start" dominant-baseline="central">the label keeps its size, the field stretches</text>
</svg>