<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img">
<title>Responder chain</title>
<desc>The responder chain goes upward: UIButton, superview, the controller's root view, UIViewController, UIWindow, UIApplication and AppDelegate if it is a UIResponder.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="880" height="200" rx="16" fill="#14151c"/>
<rect x="54.8" y="30.0" width="90.4" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="100" y="50" text-anchor="middle" dominant-baseline="central">UIButton</text>
<rect x="220.9" y="30.0" width="98.2" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="270" y="50" text-anchor="middle" dominant-baseline="central">superview</text>
<rect x="383.5" y="30.0" width="232.99999999999997" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="500" y="50" text-anchor="middle" dominant-baseline="central">controller's root view</text>
<rect x="683.6" y="30.0" width="152.8" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="760" y="50" text-anchor="middle" dominant-baseline="central">UIViewController</text>
<path d="M145.2 50 H220.9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M319.1 50 H383.5" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M616.5 50 H683.6" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="54.8" y="130.0" width="90.4" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="100" y="150" text-anchor="middle" dominant-baseline="central">UIWindow</text>
<rect x="235.3" y="130.0" width="129.39999999999998" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="300" y="150" text-anchor="middle" dominant-baseline="central">UIApplication</text>
<rect x="503.1" y="130.0" width="113.8" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="mm" x="560" y="150" text-anchor="middle" dominant-baseline="central">AppDelegate</text>
<text class="s" x="630.9" y="150" text-anchor="start" dominant-baseline="central">if UIResponder</text>
<path d="M760 70 V100.0 H100 V130" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M145.2 150 H235.3" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M364.7 150 H503.1" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>
