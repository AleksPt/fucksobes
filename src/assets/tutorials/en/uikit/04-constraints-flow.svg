<svg xmlns="http://www.w3.org/2000/svg" width="784" height="108" viewBox="0 0 784 108" role="img">
<title>How constraints turn into a layout</title>
<desc>Constraints set the rules, Auto Layout solves the system, which gives each view's frame, and layoutSubviews applies the result.</desc>
