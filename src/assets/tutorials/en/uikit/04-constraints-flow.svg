<rect x="408" y="26.0" width="160" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="488.0" y="44.0" text-anchor="middle" dominant-baseline="central">frame</text>
<text class="s" x="488.0" y="65.0" text-anchor="middle" dominant-baseline="central">of each view</text>
