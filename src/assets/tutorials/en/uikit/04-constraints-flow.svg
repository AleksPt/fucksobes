<text class="m" x="104.0" y="44.0" text-anchor="middle" dominant-baseline="central">Constraints</text>
<text class="s" x="104.0" y="65.0" text-anchor="middle" dominant-baseline="central">rules</text>
<path d="M184 54 H216" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="216" y="26.0" width="160" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
