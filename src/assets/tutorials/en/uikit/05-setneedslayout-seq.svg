<svg xmlns="http://www.w3.org/2000/svg" width="800" height="444" viewBox="0 0 800 444" role="img">
<title>setNeedsLayout and layoutIfNeeded over time</title>
<desc>Your code calls setNeedsLayout twice: the view sets a flag and returns immediately, the repeated call collapses. In the next cycle the run loop calls layoutSubviews once. layoutIfNeeded calls layoutSubviews immediately if the flag is set.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="800" height="444" rx="16" fill="#14151c"/>
<rect x="68.0" y="24" width="104" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="120" y="42.0" text-anchor="middle" dominant-baseline="central">Your code</text>
<line x1="120" y1="60" x2="120" y2="420" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="352.0" y="24" width="96" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="400" y="42.0" text-anchor="middle" dominant-baseline="central">UIView</text>
<line x1="400" y1="60" x2="400" y2="420" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="583.0" y="24" width="194" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="680" y="42.0" text-anchor="middle" dominant-baseline="central">System (run loop)</text>
<line x1="680" y1="60" x2="680" y2="420" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M120 104 L396 104" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="260.0" y="92" text-anchor="middle" dominant-baseline="central">setNeedsLayout()</text>
<rect x="250" y="124" width="300" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="400.0" y="140.0" text-anchor="middle" dominant-baseline="central">"layout needed" flag, returns at once</text>
<path d="M120 196 L396 196" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="260.0" y="184" text-anchor="middle" dominant-baseline="central">setNeedsLayout() again, collapses</text>
<path d="M680 244 L404 244" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="540.0" y="232" text-anchor="middle" dominant-baseline="central">next update cycle</text>
<path d="M400 284 H436 V308 H404" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="446" y="296.0" text-anchor="start" dominant-baseline="central">layoutSubviews() once</text>
<path d="M120 350 L396 350" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="ms" x="260.0" y="338" text-anchor="middle" dominant-baseline="central">layoutIfNeeded()</text>
<rect x="250" y="370" width="300" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="400.0" y="386.0" text-anchor="middle" dominant-baseline="central">if the flag is set, layoutSubviews() at once</text>
</svg>