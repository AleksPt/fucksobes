<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img">
<title>How a frame reaches the screen</title>
<desc>The app on the main thread performs layout, display and prepare, then commit sends the layer tree to the Render Server; it renders the frame through the GPU and gets the finished frame back.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="780" height="430" rx="16" fill="#14151c"/>
<rect x="25.0" y="24" width="230" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="140" y="42.0" text-anchor="middle" dominant-baseline="central">App (main thread)</text>
<line x1="140" y1="60" x2="140" y2="406" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="455.0" y="24" width="130" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="520" y="42.0" text-anchor="middle" dominant-baseline="central">Render Server</text>
<line x1="520" y1="60" x2="520" y2="406" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="655.0" y="24" width="90" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="700" y="42.0" text-anchor="middle" dominant-baseline="central">GPU</text>
<line x1="700" y1="60" x2="700" y2="406" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M140 100 H176 V124 H144" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="186" y="112.0" text-anchor="start" dominant-baseline="central">layout (layoutSubviews, constraints)</text>
<path d="M140 160 H176 V184 H144" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="186" y="172.0" text-anchor="start" dominant-baseline="central">display (draw, if overridden)</text>
<path d="M140 220 H176 V244 H144" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="186" y="232.0" text-anchor="start" dominant-baseline="central">prepare (image decoding)</text>
<path d="M140 290 L516 290" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="330.0" y="278" text-anchor="middle" dominant-baseline="central">commit (sending the layer tree)</text>
<path d="M520 340 L696 340" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="610.0" y="328" text-anchor="middle" dominant-baseline="central">animations and rendering</text>
<path d="M700 390 L524 390" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="610.0" y="378" text-anchor="middle" dominant-baseline="central">finished frame</text>
</svg>