<svg xmlns="http://www.w3.org/2000/svg" width="712" height="108" viewBox="0 0 712 108" role="img">
<title>The Auto Layout cycle: three phases</title>
<desc>Three phases in a row: update constraints bottom-up, layout top-down, display top-down.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="712" height="108" rx="16" fill="#14151c"/>
<rect x="24" y="26" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="124.0" y="44.0" text-anchor="middle" dominant-baseline="central">1. Update constraints</text>
<text class="s" x="124.0" y="65.0" text-anchor="middle" dominant-baseline="central">bottom-up</text>
<path d="M224 54 H256" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="256" y="26" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="356.0" y="44.0" text-anchor="middle" dominant-baseline="central">2. Layout</text>
<text class="s" x="356.0" y="65.0" text-anchor="middle" dominant-baseline="central">top-down</text>
<path d="M456 54 H488" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="488" y="26" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="588.0" y="44.0" text-anchor="middle" dominant-baseline="central">3. Display</text>
<text class="s" x="588.0" y="65.0" text-anchor="middle" dominant-baseline="central">top-down</text>
</svg>