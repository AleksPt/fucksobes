<svg xmlns="http://www.w3.org/2000/svg" width="1054" height="170" viewBox="0 0 1054 170" role="img">
<title>A frame's path from the main thread to the screen</title>
<desc>The main thread handles an event and updates the UI, then comes the Core Animation commit, then the render server: the CPU prepares work, the GPU draws the frame, and the frame reaches the screen on the next vsync.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="1054" height="170" rx="16" fill="#14151c"/>
<rect x="30.0" y="45.0" width="170" height="80" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="115.0" y="67.0" text-anchor="middle" dominant-baseline="central">Main thread</text>
<text class="t" x="115.0" y="85.0" text-anchor="middle" dominant-baseline="central">event,</text>
<text class="t" x="115.0" y="103.0" text-anchor="middle" dominant-baseline="central">UI update</text>
<path d="M200.0 85.0 H232.0" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="236.0" y="45.0" width="170" height="80" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="321.0" y="76.0" text-anchor="middle" dominant-baseline="central">Core Animation</text>
<text class="t" x="321.0" y="94.0" text-anchor="middle" dominant-baseline="central">commit</text>
<path d="M406.0 85.0 H438.0" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="442.0" y="45.0" width="170" height="80" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="527.0" y="76.0" text-anchor="middle" dominant-baseline="central">Render server:</text>
<text class="t" x="527.0" y="94.0" text-anchor="middle" dominant-baseline="central">CPU prepares the work</text>
<path d="M612.0 85.0 H644.0" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="648.0" y="45.0" width="170" height="80" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="733.0" y="76.0" text-anchor="middle" dominant-baseline="central">Render server:</text>
<text class="t" x="733.0" y="94.0" text-anchor="middle" dominant-baseline="central">GPU draws the frame</text>
<path d="M818.0 85.0 H850.0" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="854.0" y="45.0" width="170" height="80" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="939.0" y="76.0" text-anchor="middle" dominant-baseline="central">Screen on</text>
<text class="t" x="939.0" y="94.0" text-anchor="middle" dominant-baseline="central">the next vsync</text>
</svg>