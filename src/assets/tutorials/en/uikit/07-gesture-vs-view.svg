<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img">
<title>Gesture and touches: who receives first</title>
<desc>The window first sends touches to the gesture recognizer. If the gesture is recognized, the remaining touches to the view are cancelled via touchesCancelled; if not recognized (failed), the touches are delivered to the view.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="800" height="390" rx="16" fill="#14151c"/>
<rect x="45.0" y="24" width="110" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="100" y="42.0" text-anchor="middle" dominant-baseline="central">UIWindow</text>
<line x1="100" y1="60" x2="100" y2="366" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="255.0" y="24" width="170" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="340" y="42.0" text-anchor="middle" dominant-baseline="central">Gesture recognizer</text>
<line x1="340" y1="60" x2="340" y2="366" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="645.0" y="24" width="90" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="690" y="42.0" text-anchor="middle" dominant-baseline="central">View</text>
<line x1="690" y1="60" x2="690" y2="366" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M100 110 L336 110" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="220.0" y="98" text-anchor="middle" dominant-baseline="central">touches before the view</text>
<rect x="20" y="150" width="760" height="210" rx="8" fill="none" stroke="#fff" stroke-opacity="0.2"/>
<rect x="20" y="150" width="46" height="22" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.2"/>
<text class="ms" x="43" y="161" text-anchor="middle" dominant-baseline="central">alt</text>
<text class="s" x="118" y="161" text-anchor="start" dominant-baseline="central">gesture recognized</text>
<line x1="20" y1="262" x2="780" y2="262" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<text class="s" x="118" y="278" text-anchor="start" dominant-baseline="central">gesture not recognized - failed</text>
<path d="M340 218 L686 218" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="515.0" y="206" text-anchor="middle" dominant-baseline="central">remaining touches cancelled - touchesCancelled</text>
<path d="M100 330 L686 330" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="395.0" y="318" text-anchor="middle" dominant-baseline="central">touches are delivered to the view</text>
</svg>
