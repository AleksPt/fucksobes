<svg xmlns="http://www.w3.org/2000/svg" width="774" height="200" viewBox="0 0 774 200" role="img">
<title>UIView callback order when adding a view</title>
<desc>The chain when adding a view to a displayed superview: init, addSubview, willMove toSuperview, willMove toWindow, didMoveToSuperview, didMoveToWindow, layoutSubviews and draw, if it is overridden.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="774" height="200" rx="16" fill="#14151c"/>
<rect x="24.0" y="30.0" width="59.2" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="53.6" y="50" text-anchor="middle" dominant-baseline="central">init</text>
<path d="M83.2 50 H115.2" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="115.19999999999999" y="30.0" width="106.0" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="168.2" y="50" text-anchor="middle" dominant-baseline="central">addSubview</text>
<path d="M221.2 50 H253.2" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="253.2" y="30.0" width="184.0" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="345.2" y="50" text-anchor="middle" dominant-baseline="central">willMove toSuperview</text>
<path d="M437.2 50 H469.2" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="469.2" y="30.0" width="160.6" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="549.5" y="50" text-anchor="middle" dominant-baseline="central">willMove toWindow</text>
<rect x="24.0" y="130.0" width="168.4" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="108.2" y="150" text-anchor="middle" dominant-baseline="central">didMoveToSuperview</text>
<path d="M192.4 150 H224.4" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="224.39999999999998" y="130.0" width="145.0" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="296.9" y="150" text-anchor="middle" dominant-baseline="central">didMoveToWindow</text>
<path d="M369.4 150 H401.4" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="401.4" y="130.0" width="137.2" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="470.0" y="150" text-anchor="middle" dominant-baseline="central">layoutSubviews</text>
<path d="M538.5999999999999 150 H570.5999999999999" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="570.5999999999999" y="124.0" width="180" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="m" x="660.5999999999999" y="140.0" text-anchor="middle" dominant-baseline="central">draw</text>
<text class="s" x="660.5999999999999" y="161.0" text-anchor="middle" dominant-baseline="central">if overridden</text>
<path d="M549.5 70 V100.0 H108.2 V130" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>