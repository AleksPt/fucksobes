<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="260" viewBox="0 0 1010 260" role="img">
<title>Cell reuse</title>
<desc>A cell that went off the screen edge goes into the reuse queue. When a cell is needed for a new row, it checks whether the queue has a cell of the needed type: if so, it is taken and prepareForReuse is called, if not, a new one is created. Then the content is configured in cellForRowAt.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="1010" height="260" rx="16" fill="#14151c"/>
<rect x="10.0" y="22.0" width="150" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="85" y="41.0" text-anchor="middle" dominant-baseline="central">A cell goes</text>
<text class="t" x="85" y="59.0" text-anchor="middle" dominant-baseline="central">off the screen edge</text>
<rect x="10.0" y="182.0" width="150" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="85" y="201.0" text-anchor="middle" dominant-baseline="central">A cell is needed</text>
<text class="t" x="85" y="219.0" text-anchor="middle" dominant-baseline="central">for a new row</text>
<rect x="200.0" y="22.0" width="120" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="260" y="41.0" text-anchor="middle" dominant-baseline="central">Reuse</text>
<text class="t" x="260" y="59.0" text-anchor="middle" dominant-baseline="central">queue</text>
<polygon points="490 70.0 610.0 130 490 190.0 370.0 130" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12" stroke-linejoin="round"/>
<text class="t" x="490" y="112.0" text-anchor="middle" dominant-baseline="central">Is there</text>
<text class="t" x="490" y="130.0" text-anchor="middle" dominant-baseline="central">a cell</text>
<text class="t" x="490" y="148.0" text-anchor="middle" dominant-baseline="central">of the right type?</text>
<rect x="660.0" y="42.0" width="150" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="735" y="61.0" text-anchor="middle" dominant-baseline="central">Take it and call</text>
<text class="mm" x="735" y="79.0" text-anchor="middle" dominant-baseline="central">prepareForReuse</text>
<rect x="660.0" y="170.0" width="150" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="735" y="190.0" text-anchor="middle" dominant-baseline="central">Create a new one</text>
<rect x="860.0" y="93.0" width="130" height="74" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="925" y="112.0" text-anchor="middle" dominant-baseline="central">Configure</text>
<text class="t" x="925" y="130.0" text-anchor="middle" dominant-baseline="central">content in</text>
<text class="mm" x="925" y="148.0" text-anchor="middle" dominant-baseline="central">cellForRowAt</text>
<path d="M160 50 H200" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M320 50 H490 V70" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M160 210 H490 V190" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M610 130 H635.0 V70 H660" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="641" y="100" text-anchor="start" dominant-baseline="central">yes</text>
<path d="M610 130 H635.0 V190 H660" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="641" y="160" text-anchor="start" dominant-baseline="central">no</text>
<path d="M810 70 H835.0 V130 H860" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M810 190 H835.0 V130 H860" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>
