<svg xmlns="http://www.w3.org/2000/svg" width="980" height="410" viewBox="0 0 980 410" role="img">
<title>The touch path from the finger to the view</title>
<desc>A finger touches the screen, the system passes UIApplication a UIEvent with a UITouch, UIApplication calls sendEvent on UIWindow, the window starts hitTest and gets the found view, then sends it touchesBegan, touchesMoved and touchesEnded.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="980" height="410" rx="16" fill="#14151c"/>
<rect x="42.0" y="24" width="96" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="90" y="42.0" text-anchor="middle" dominant-baseline="central">Finger</text>
<line x1="90" y1="60" x2="90" y2="386" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="202.0" y="24" width="96" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="250" y="42.0" text-anchor="middle" dominant-baseline="central">System</text>
<line x1="250" y1="60" x2="250" y2="386" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="355.0" y="24" width="150" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="430" y="42.0" text-anchor="middle" dominant-baseline="central">UIApplication</text>
<line x1="430" y1="60" x2="430" y2="386" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="555.0" y="24" width="110" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="610" y="42.0" text-anchor="middle" dominant-baseline="central">UIWindow</text>
<line x1="610" y1="60" x2="610" y2="386" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="800.0" y="24" width="160" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="880" y="42.0" text-anchor="middle" dominant-baseline="central">View (hitTest)</text>
<line x1="880" y1="60" x2="880" y2="386" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M90 110 L246 110" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="170.0" y="98" text-anchor="middle" dominant-baseline="central">touch</text>
<path d="M250 160 L426 160" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="340.0" y="148" text-anchor="middle" dominant-baseline="central">UIEvent with UITouch</text>
<path d="M430 210 L606 210" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="520.0" y="198" text-anchor="middle" dominant-baseline="central">sendEvent</text>
<path d="M610 260 L876 260" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="745.0" y="248" text-anchor="middle" dominant-baseline="central">hitTest: find the deepest view</text>
<path d="M880 310 L614 310" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="745.0" y="298" text-anchor="middle" dominant-baseline="central">view found</text>
<path d="M610 360 L876 360" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a)"/>
<text class="s" x="745.0" y="348" text-anchor="middle" dominant-baseline="central">touchesBegan, touchesMoved, touchesEnded</text>
</svg>