<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img">
<title>struct and class: copies versus a shared object</title>
<desc>Left, struct: two independent copies a and b. Right, class: two references c1 and c2 point to the same Counter object.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="316" rx="16" fill="#14151c"/>
<rect x="24" y="24" width="320" height="268" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="48" y="48" width="64" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="80.0" y="62.0" text-anchor="middle" dominant-baseline="central">struct</text>
<text class="h" x="48" y="112" text-anchor="start" dominant-baseline="central">Two independent copies</text>
<rect x="48" y="136" width="128" height="72" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="64" y="156" text-anchor="start" dominant-baseline="central">a</text>
<text class="mv" x="64" y="186" text-anchor="start" dominant-baseline="central">x = 1</text>
<rect x="192" y="136" width="128" height="72" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="s" x="208" y="156" text-anchor="start" dominant-baseline="central">b</text>
<text class="mv" x="208" y="186" text-anchor="start" dominant-baseline="central">x = 100</text>
<text class="b" x="48" y="272" text-anchor="start" dominant-baseline="central">Assignment copies the value</text>
<rect x="376" y="24" width="320" height="268" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<rect x="400" y="48" width="64" height="28" rx="14" fill="none" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="432.0" y="62.0" text-anchor="middle" dominant-baseline="central">class</text>
<text class="h" x="400" y="112" text-anchor="start" dominant-baseline="central">One object</text>
<rect x="400" y="140" width="80" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mv" x="440" y="162" text-anchor="middle" dominant-baseline="central">c1</text>
<rect x="400" y="196" width="80" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mv" x="440" y="218" text-anchor="middle" dominant-baseline="central">c2</text>
<rect x="560" y="156" width="112" height="72" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="576" y="180" text-anchor="start" dominant-baseline="central">Counter</text>
<text class="ma" x="576" y="206" text-anchor="start" dominant-baseline="central">value = 5</text>
<path d="M484 162 L554 178" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M484 218 L554 206" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="b" x="400" y="272" text-anchor="start" dominant-baseline="central">Both references see the same object</text>
</svg>
