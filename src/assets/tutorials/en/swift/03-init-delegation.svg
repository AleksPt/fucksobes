<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" role="img">
<title>Initializer delegation</title>
<desc>The subclass's convenience initializer calls self.init on its own designated initializer. The subclass's designated initializer calls super.init on the superclass's designated initializer. The superclass's convenience initializer calls self.init on its own designated initializer.</desc>
