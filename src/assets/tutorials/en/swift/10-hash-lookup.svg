<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img">
<title>Hash table lookup</title>
<desc>The key is turned into a hash, and the hash into a bucket index. If the bucket is free, the element is written or found. Otherwise the values are compared with == and the search continues.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="272" rx="16" fill="#14151c"/>
<rect x="40" y="40" width="80" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="80.0" y="68.0" text-anchor="middle" dominant-baseline="central">Key</text>
<rect x="152" y="40" width="140" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="222.0" y="68.0" text-anchor="middle" dominant-baseline="central">hash(into:)</text>
<rect x="324" y="40" width="140" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="394.0" y="58.0" text-anchor="middle" dominant-baseline="central">Bucket index</text>
<text class="s" x="394.0" y="79.0" text-anchor="middle" dominant-baseline="central">hash mod size</text>
<rect x="496" y="40" width="184" height="56" rx="28" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="588.0" y="68.0" text-anchor="middle" dominant-baseline="central">Bucket free?</text>
<path d="M124 68 L148 68" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M296 68 L320 68" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M468 68 L492 68" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M612 96 L612 172" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="622" y="136" text-anchor="start" dominant-baseline="central">no</text>
<path d="M545 96 V136 H355 V172" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="450" y="124" text-anchor="middle" dominant-baseline="central">yes</text>
<rect x="255" y="176" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="355.0" y="204.0" text-anchor="middle" dominant-baseline="central">Insert or find</text>
<rect x="500" y="176" width="180" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="590.0" y="194.0" text-anchor="middle" dominant-baseline="central">Compare with ==</text>
<text class="s" x="590.0" y="215.0" text-anchor="middle" dominant-baseline="central">and keep searching</text>
</svg>
