<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" role="img">
<title>How the dispatch kind is chosen</title>
<desc>If the method is dynamic or @objc in an NSObject subclass, message dispatch is used. Otherwise, if there is nothing to override, static dispatch. Classes use a vtable, protocols use a witness table.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="396" rx="16" fill="#14151c"/>
<rect x="170" y="24" width="160" height="44" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="250.0" y="46.0" text-anchor="middle" dominant-baseline="central">Method call</text>
<path d="M250 72 L250 104" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="100" y="108" width="300" height="56" rx="28" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="250.0" y="136.0" text-anchor="middle" dominant-baseline="central">@objc dynamic in NSObject?</text>
<path d="M404 136 L496 136" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="450" y="124" text-anchor="middle" dominant-baseline="central">yes</text>
<rect x="500" y="108" width="180" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="590.0" y="126.0" text-anchor="middle" dominant-baseline="central">Message dispatch</text>
<text class="s" x="590.0" y="147.0" text-anchor="middle" dominant-baseline="central">via the Objective-C runtime</text>
<path d="M250 168 L250 204" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="262" y="188" text-anchor="start" dominant-baseline="central">no</text>
<rect x="100" y="208" width="300" height="56" rx="28" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="250.0" y="226.0" text-anchor="middle" dominant-baseline="central">Anything to override?</text>
<text class="s" x="250.0" y="247.0" text-anchor="middle" dominant-baseline="central">class or protocol</text>
<path d="M250 264 V290 H145 V312" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M250 264 V290 H365 V312" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M250 264 V290 H580 V312" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="153" y="304" text-anchor="start" dominant-baseline="central">no</text>
<text class="s" x="373" y="304" text-anchor="start" dominant-baseline="central">class</text>
<text class="s" x="588" y="304" text-anchor="start" dominant-baseline="central">protocol</text>
<rect x="40" y="316" width="210" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="145.0" y="334.0" text-anchor="middle" dominant-baseline="central">Static (direct)</text>
<text class="s" x="145.0" y="355.0" text-anchor="middle" dominant-baseline="central">struct, enum, final, extension</text>
<rect x="270" y="316" width="190" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="365.0" y="334.0" text-anchor="middle" dominant-baseline="central">Table: vtable</text>
<text class="s" x="365.0" y="355.0" text-anchor="middle" dominant-baseline="central">class methods</text>
<rect x="480" y="316" width="200" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="580.0" y="334.0" text-anchor="middle" dominant-baseline="central">Table: witness table</text>
<text class="s" x="580.0" y="355.0" text-anchor="middle" dominant-baseline="central">call through a protocol</text>
</svg>
