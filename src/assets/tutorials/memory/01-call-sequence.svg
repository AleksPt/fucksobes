<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img">
<title>Вызов функции и кадр стека</title>
<desc>Последовательность: вызов, локальные переменные в кадр, выделение объекта в куче, возврат, кадр уничтожен, объект жив.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="340" rx="16" fill="#14151c"/>
<rect x="10.0" y="20" width="180" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="100.0" y="38.0" text-anchor="middle" dominant-baseline="central">Вызывающий код</text>
<line x1="100" y1="56" x2="100" y2="326" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="260.0" y="20" width="180" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="350.0" y="38.0" text-anchor="middle" dominant-baseline="central">Стек (кадр функции)</text>
<line x1="350" y1="56" x2="350" y2="326" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="510.0" y="20" width="180" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="600.0" y="38.0" text-anchor="middle" dominant-baseline="central">Куча</text>
<line x1="600" y1="56" x2="600" y2="326" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M104 92 H346" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="225.0" y="80" text-anchor="middle" dominant-baseline="central">вызов example()</text>
<path d="M354 112 H394 V132 H356" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="404" y="122" text-anchor="start" dominant-baseline="central">x, y, z в кадр</text>
<path d="M354 176 H596" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="475.0" y="164" text-anchor="middle" dominant-baseline="central">MyClass(): выделить память</text>
<path d="M596 208 H354" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="475.0" y="196" text-anchor="middle" dominant-baseline="central">ссылка на объект</text>
<path d="M346 240 H104" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="225.0" y="228" text-anchor="middle" dominant-baseline="central">return</text>
<rect x="250" y="262" width="200" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="350.0" y="278" text-anchor="middle" dominant-baseline="central">кадр уничтожен целиком</text>
<rect x="504" y="262" width="192" height="50" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="600.0" y="278" text-anchor="middle" dominant-baseline="central">объект жив, если остался</text>
<text class="s" x="600.0" y="296" text-anchor="middle" dominant-baseline="central">strong-ссылка</text>
</svg>