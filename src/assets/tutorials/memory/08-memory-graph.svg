<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img">
<title>График памяти с autoreleasepool и без</title>
<desc>Слева без autoreleasepool память растёт до конца цикла, около 43 МБ, потом резкий сброс. Справа с autoreleasepool в цикле пила со сбросом на каждой итерации, пик около 14 МБ.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="330" rx="16" fill="#14151c"/>
<rect x="24" y="16" width="320" height="298" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="48" y="44" text-anchor="start" dominant-baseline="central">Без autoreleasepool</text>
<path d="M64 240 V72" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M64 240 H314" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="72" y="70" text-anchor="start" dominant-baseline="central">память</text>
<text class="s" x="314" y="256" text-anchor="end" dominant-baseline="central">время</text>
<text class="s" x="48" y="290" text-anchor="start" dominant-baseline="central">растёт до конца цикла, потом резкий сброс</text>
<rect x="376" y="16" width="320" height="298" rx="24" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="400" y="44" text-anchor="start" dominant-baseline="central">С autoreleasepool в цикле</text>
<path d="M416 240 V72" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M416 240 H666" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="424" y="70" text-anchor="start" dominant-baseline="central">память</text>
<text class="s" x="666" y="256" text-anchor="end" dominant-baseline="central">время</text>
<text class="s" x="400" y="290" text-anchor="start" dominant-baseline="central">пила: сброс на каждой итерации, пик ограничен</text>
<path d="M64 240 H74 V210 H104 V180 H134 V150 H164 V120 H194 V90 H234 V240 H264" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="2" stroke-linejoin="round"/>
<line x1="64" y1="90" x2="234" y2="90" stroke="#fff" stroke-opacity="0.25"/>
<text class="ms" x="240" y="90" text-anchor="start" dominant-baseline="central">~43 МБ</text>
<path d="M416 240 L456 192 L456 232 L492 192 L492 232 L528 192 L528 232 L564 192 L564 232 L600 192 L600 232 L636 192 L636 232" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="2" stroke-linejoin="round"/>
<line x1="416" y1="192" x2="656" y2="192" stroke="#fff" stroke-opacity="0.25"/>
<text class="ms" x="656" y="178" text-anchor="end" dominant-baseline="central">~14 МБ</text>
</svg>
