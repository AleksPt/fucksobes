<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img">
<title>Стек при вызове функции</title>
<desc>Caller кладёт параметры и адрес возврата, функция кладёт и снимает локальные переменные, затем из стека берётся адрес возврата и выполняется переход.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="760" height="290" rx="16" fill="#14151c"/>
<rect x="50.0" y="20" width="160" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="130.0" y="38.0" text-anchor="middle" dominant-baseline="central">Caller</text>
<line x1="130" y1="56" x2="130" y2="276" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<rect x="390.0" y="20" width="160" height="36" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="470.0" y="38.0" text-anchor="middle" dominant-baseline="central">Stack</text>
<line x1="470" y1="56" x2="470" y2="276" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<path d="M134 92 H466" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="300.0" y="80" text-anchor="middle" dominant-baseline="central">push(параметры, адрес возврата)</text>
<path d="M474 116 H514 V136 H476" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="524" y="126" text-anchor="start" dominant-baseline="central">push(локальные переменные)</text>
<rect x="370" y="156" width="200" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="470.0" y="172" text-anchor="middle" dominant-baseline="central">функция работает</text>
<path d="M474 204 H514 V224 H476" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="524" y="214" text-anchor="start" dominant-baseline="central">pop(локальные переменные)</text>
<path d="M466 256 H134" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="300.0" y="244" text-anchor="middle" dominant-baseline="central">pop(адрес возврата), переход</text>
</svg>
