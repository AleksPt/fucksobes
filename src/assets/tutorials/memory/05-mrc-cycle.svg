<svg xmlns="http://www.w3.org/2000/svg" width="740" height="160" viewBox="0 0 740 160" role="img">
<title>Жизненный цикл объекта в MRC</title>
<desc>alloc ставит счётчик 1, retain добавляет 1, release убирает 1. Если счётчик больше 0, снова retain; если равен 0, dealloc освобождает память.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="740" height="160" rx="16" fill="#14151c"/>
<rect x="24" y="76" width="110" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="79.0" y="94.0" text-anchor="middle" dominant-baseline="central">alloc</text>
<text class="s" x="79.0" y="115.0" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="194" y="76" width="110" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="249.0" y="94.0" text-anchor="middle" dominant-baseline="central">retain</text>
<text class="s" x="249.0" y="115.0" text-anchor="middle" dominant-baseline="central">+1</text>
<rect x="364" y="76" width="110" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="m" x="419.0" y="94.0" text-anchor="middle" dominant-baseline="central">release</text>
<text class="s" x="419.0" y="115.0" text-anchor="middle" dominant-baseline="central">-1</text>
<rect x="590" y="76" width="130" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="m" x="655.0" y="94.0" text-anchor="middle" dominant-baseline="central">dealloc</text>
<text class="s" x="655.0" y="115.0" text-anchor="middle" dominant-baseline="central">память освобождена</text>
<path d="M138 104.0 H190" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M308 104.0 H360" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M419 76 V44 H249 V72" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="334" y="30" text-anchor="middle" dominant-baseline="central">счётчик &gt; 0</text>
<path d="M478 104.0 H586" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="532" y="90.0" text-anchor="middle" dominant-baseline="central">счётчик == 0</text>
</svg>
