<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img">
<title>Stack (LIFO) и Heap (любой порядок)</title>
<desc>Стек: кадры main, loadData, parse, вершина на parse. Куча: объект A, свободно, объект C, объект B.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="310" rx="16" fill="#14151c"/>
<text class="s" x="40" y="28" text-anchor="start" dominant-baseline="central">Stack (LIFO)</text>
<text class="s" x="460" y="28" text-anchor="start" dominant-baseline="central">Heap (любой порядок)</text>
<rect x="40" y="194" width="260" height="48" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="170.0" y="218.0" text-anchor="middle" dominant-baseline="central">кадр main()</text>
<rect x="40" y="122" width="260" height="48" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="170.0" y="146.0" text-anchor="middle" dominant-baseline="central">кадр loadData()</text>
<rect x="40" y="50" width="260" height="48" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="170.0" y="74.0" text-anchor="middle" dominant-baseline="central">кадр parse()</text>
<path d="M170 192 V172" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M170 120 V100" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M372 74 H306" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="t" x="380" y="74" text-anchor="start" dominant-baseline="central">вершина</text>
<rect x="460" y="50" width="220" height="48" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="570.0" y="74.0" text-anchor="middle" dominant-baseline="central">объект A</text>
<rect x="460" y="110" width="220" height="48" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="t" x="570.0" y="134.0" text-anchor="middle" dominant-baseline="central">свободно</text>
<rect x="460" y="170" width="220" height="48" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="570.0" y="194.0" text-anchor="middle" dominant-baseline="central">объект C</text>
<rect x="460" y="230" width="220" height="48" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="570.0" y="254.0" text-anchor="middle" dominant-baseline="central">объект B</text>
<text class="s" x="40" y="280" text-anchor="start" dominant-baseline="central">стек: добавляем и снимаем только сверху</text>
