<text class="s" x="325" y="74" text-anchor="middle" dominant-baseline="central">объект</text>
<rect x="242" y="90" width="50" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="ms" x="267.0" y="110" text-anchor="middle" dominant-baseline="central">isa</text>
<rect x="296" y="90" width="78" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="ms" x="335.0" y="110" text-anchor="middle" dominant-baseline="central">refCounts</text>
<rect x="378" y="90" width="34" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
