<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" role="img">
<title>Адресное пространство процесса</title>
<desc>Сверху вниз: Text, Data, Heap, свободное место, Stack. Heap растёт вниз, Stack растёт вверх.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="720" height="396" rx="16" fill="#14151c"/>
<text class="s" x="40" y="28" text-anchor="start" dominant-baseline="central">младшие адреса</text>
<rect x="40" y="52" width="300" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="190.0" y="78.0" text-anchor="middle" dominant-baseline="central">Text</text>
<text class="b" x="360" y="78" text-anchor="start" dominant-baseline="central">машинный код, read-only, фиксирован</text>
<rect x="40" y="112" width="300" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="190.0" y="138.0" text-anchor="middle" dominant-baseline="central">Data</text>
<text class="b" x="360" y="138" text-anchor="start" dominant-baseline="central">глобальное, константы, метаданные типов</text>
<rect x="40" y="172" width="300" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="190.0" y="198.0" text-anchor="middle" dominant-baseline="central">Heap</text>
<text class="b" x="360" y="198" text-anchor="start" dominant-baseline="central">объекты, общая для потоков</text>
<rect x="40" y="232" width="300" height="56" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<path d="M110 240 V280" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="124" y="250" text-anchor="start" dominant-baseline="central">Heap растёт</text>
<path d="M220 280 V240" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="234" y="270" text-anchor="start" dominant-baseline="central">Stack растёт</text>
<text class="b" x="360" y="260" text-anchor="start" dominant-baseline="central">свободное место</text>
<rect x="40" y="296" width="300" height="52" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="t" x="190.0" y="322.0" text-anchor="middle" dominant-baseline="central">Stack</text>
<text class="b" x="360" y="322" text-anchor="start" dominant-baseline="central">локальные переменные, свой у каждого потока</text>
<text class="s" x="40" y="372" text-anchor="start" dominant-baseline="central">старшие адреса</text>
</svg>