<rect x="65" y="84" width="270" height="32" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45" stroke-dasharray="4 4"/>
<text class="s" x="200.0" y="100.0" text-anchor="middle" dominant-baseline="central">init (создание объекта)</text>
