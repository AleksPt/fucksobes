<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img">
<title>Состояния жеста</title>
<desc>Дискретный жест: possible переходит в recognized или failed. Непрерывный: possible, began, changed много раз, затем ended или cancelled; из began можно сразу в ended.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="900" height="460" rx="16" fill="#14151c"/>
<rect x="20" y="20" width="860" height="150" rx="12" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<text class="s" x="36" y="42" text-anchor="start" dominant-baseline="central">Дискретный жест</text>
<rect x="74.8" y="90.0" width="90.4" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="120" y="110" text-anchor="middle" dominant-baseline="central">possible</text>
<rect x="367.0" y="60.0" width="106.0" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="420" y="80" text-anchor="middle" dominant-baseline="central">recognized</text>
<rect x="382.6" y="120.0" width="74.8" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="420" y="140" text-anchor="middle" dominant-baseline="central">failed</text>
<path d="M165.2 110 H266.1 V80 H367.0" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M165.2 110 H273.9 V140 H382.6" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="20" y="190" width="860" height="250" rx="12" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-dasharray="4 4"/>
<text class="s" x="36" y="212" text-anchor="start" dominant-baseline="central">Непрерывный жест</text>
<rect x="74.8" y="310.0" width="90.4" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="120" y="330" text-anchor="middle" dominant-baseline="central">possible</text>
<rect x="256.5" y="310.0" width="67.0" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="290" y="330" text-anchor="middle" dominant-baseline="central">began</text>
<rect x="428.1" y="310.0" width="183.79999999999998" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="520" y="330" text-anchor="middle" dominant-baseline="central">changed - много раз</text>
<rect x="746.5" y="270.0" width="67.0" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="mm" x="780" y="290" text-anchor="middle" dominant-baseline="central">ended</text>
<rect x="730.9" y="350.0" width="98.2" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
