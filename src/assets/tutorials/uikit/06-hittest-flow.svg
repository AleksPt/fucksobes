<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
<title>Алгоритм hitTest</title>
<desc>Схема: view проверяется на скрытость, отключённое взаимодействие и alpha меньше 0.01, затем на попадание точки в bounds; если проверки пройдены, обходятся subviews от верхней к нижней. Если кто-то вернул view, возвращается эта глубокая view, иначе self; при провале проверок возвращается nil.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:500;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="800" height="600" rx="16" fill="#14151c"/>
<rect x="200.0" y="24.0" width="200" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="300" y="44" text-anchor="middle" dominant-baseline="central">hitTest на view</text>
<path d="M300 64 V92" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<polygon points="300 92.0 450.0 142 300 192.0 150.0 142" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12" stroke-linejoin="round"/>
<text class="t" x="300" y="133.0" text-anchor="middle" dominant-baseline="central">скрыта, userInteraction</text>
<text class="t" x="300" y="151.0" text-anchor="middle" dominant-baseline="central">выключен, alpha меньше 0.01?</text>
<rect x="535.0" y="122.0" width="130" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="600" y="142" text-anchor="middle" dominant-baseline="central">вернуть nil</text>
<path d="M450 142 H535" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="492" y="130" text-anchor="middle" dominant-baseline="central">да</text>
<path d="M300 192 V220" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="312" y="206" text-anchor="start" dominant-baseline="central">нет</text>
<polygon points="300 220.0 420.0 264 300 308.0 180.0 264" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12" stroke-linejoin="round"/>
<text class="t" x="300" y="255.0" text-anchor="middle" dominant-baseline="central">point inside:</text>
<text class="t" x="300" y="273.0" text-anchor="middle" dominant-baseline="central">точка в bounds?</text>
<path d="M420 264 H600 V164" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="500" y="252" text-anchor="middle" dominant-baseline="central">нет</text>
<path d="M300 308 V336" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="312" y="322" text-anchor="start" dominant-baseline="central">да</text>
<rect x="145.0" y="336.0" width="310" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="300" y="356" text-anchor="middle" dominant-baseline="central">обойти subviews от верхней к нижней</text>
<path d="M300 376 V404" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<polygon points="300 404.0 420.0 444 300 484.0 180.0 444" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12" stroke-linejoin="round"/>
<text class="t" x="300" y="444.0" text-anchor="middle" dominant-baseline="central">кто-то вернул view?</text>
<path d="M420 444 H530" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="475" y="432" text-anchor="middle" dominant-baseline="central">да</text>
<rect x="530.0" y="424.0" width="220" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="640" y="444" text-anchor="middle" dominant-baseline="central">вернуть эту глубокую view</text>
<path d="M300 484 V520" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="s" x="312" y="502" text-anchor="start" dominant-baseline="central">нет</text>
<rect x="220.0" y="520.0" width="160" height="40" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="t" x="300" y="540" text-anchor="middle" dominant-baseline="central">вернуть self</text>
</svg>
