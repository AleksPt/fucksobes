<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img">
<title>frame и bounds</title>
<desc>Вложенная view child внутри superview: frame (20, 30, 100, 100) в координатах родителя, bounds (0, 0, 100, 100) в собственных, у child свой левый верхний угол (0, 0).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0400-04FF;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Onest';font-weight:400;unicode-range:U+0000-03FF,U+2000-206F;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'FS Onest','Onest Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#ffffff}
.s{font-size:12px;font-weight:400;fill:#a4a6b0}
.b{font-size:14px;font-weight:400;fill:#a4a6b0}
.h{font-size:22px;font-weight:500;fill:#ffffff;letter-spacing:-0.44px}
.m,.mm,.mv,.ms,.ma{font-family:'FS Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.m{font-size:14px;fill:#ffffff}
.mm{font-size:13px;fill:#ffffff}
.mv{font-size:16px;fill:#ffffff}
.ms{font-size:12px;fill:#a4a6b0}
.ma{font-size:14px;fill:#d4d5da}
</style></defs>
<rect width="780" height="300" rx="16" fill="#14151c"/>
<path d="M40 28 H430" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="444" y="28" text-anchor="start" dominant-baseline="central">x</text>
<path d="M24 44 V270" fill="none" stroke="#a4a6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="ms" x="24" y="284" text-anchor="middle" dominant-baseline="central">y</text>
<rect x="40" y="44" width="390" height="226" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.12"/>
<text class="ms" x="52" y="60" text-anchor="start" dominant-baseline="central">(0, 0)</text>
<text class="mm" x="418" y="60" text-anchor="end" dominant-baseline="central">superview</text>
<rect x="112" y="112" width="232" height="130" rx="8" fill="#1b1c24" stroke="#fff" stroke-opacity="0.45"/>
<text class="ms" x="112" y="98" text-anchor="start" dominant-baseline="central">(20, 30)</text>
<text class="mm" x="228" y="148" text-anchor="middle" dominant-baseline="central">child</text>
<text class="s" x="228" y="190" text-anchor="middle" dominant-baseline="central">внутри child своё (0, 0)</text>
<text class="s" x="228" y="210" text-anchor="middle" dominant-baseline="central">левый верхний угол</text>
<text class="mm" x="470" y="140" text-anchor="start" dominant-baseline="central">child.frame  = (20, 30, 100, 100)</text>
<text class="mm" x="470" y="170" text-anchor="start" dominant-baseline="central">child.bounds = ( 0,  0, 100, 100)</text>
